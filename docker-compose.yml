services:
  media-refiner:
    image: ${MEDIA_REFINER_IMAGE:-media-refiner:latest}
    build:
      context: .
    container_name: media-refiner
    ports:
      - "${MEDIA_REFINER_PORT:-10309}:10308"
    volumes:
      - ${MEDIA_REFINER_DATA_DIR:-./data}:/workspace/data
      - ${MEDIA_REFINER_CONFIG_DIR:-./config}:/workspace/config
      - ${MEDIA_REFINER_CMS_CONFIG_DIR:-./config/cms}:/cms-config:ro
      - ${MEDIA_REFINER_MEDIA_DIR:-/volume1/media}:/media:ro
      - ${MEDIA_REFINER_CLOUDNAS_DIR:-/volume1/CloudNAS}:/CloudNAS:ro
    environment:
      - TZ=Asia/Shanghai
      - REFINER_DB_PATH=/workspace/data/refiner.db
    restart: unless-stopped

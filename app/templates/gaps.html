{% extends "base.html" %}
{% block title %}缺集管理{% endblock %}
{% block head %}
<style>
    .gap-shell {
        max-width: 1680px;
    }
    .gap-poster {
        width: 68px;
        height: 102px;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        object-position: center;
        background: linear-gradient(135deg, #e5e7eb, #f8fafc);
    }
    html.dark .gap-poster {
        background: linear-gradient(135deg, #1f2937, #111827);
    }
    .gap-chip {
        min-width: 38px;
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .gap-modal-panel {
        max-height: min(86dvh, 47.5rem);
    }
    #gapResolverModal {
        will-change: opacity;
    }
    #gapResolverModal .gap-modal-panel,
    #gapResolverBody {
        contain: layout paint;
    }
    .gap-files-panel {
        width: min(97dvw, 92rem);
        max-width: calc(100dvw - 1.25rem);
    }
    .gap-files-body {
        background: #f8fafc;
    }
    html.dark .gap-files-body {
        background: rgba(0, 0, 0, 0.12);
    }
    .gap-resolver-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .gap-resolver-card {
        border: 1px solid #e5e7eb;
        background: #fff;
        border-radius: 16px;
        padding: 12px;
    }
    html.dark .gap-resolver-card {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
    }
    .gap-resolver-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
    }
    .gap-resolver-title {
        color: #111827;
        font-size: 14px;
        font-weight: 900;
        line-height: 1.45;
        overflow-wrap: anywhere;
    }
    html.dark .gap-resolver-title {
        color: #fff;
    }
    .gap-resolver-title-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        color: inherit;
        text-align: left;
        text-decoration: none;
        transition: color 160ms ease;
    }
    .gap-resolver-title-link:hover {
        color: #007AFF;
    }
    .gap-resolver-title-link i {
        color: #9ca3af;
        font-size: 10px;
        transform: translateY(1px);
    }
    html.dark .gap-resolver-title-link i {
        color: #6b7280;
    }
    .gap-resolver-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        min-width: 0;
    }
    .gap-resolver-pill,
    .gap-resolver-status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 100%;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        line-height: 1.2;
        white-space: nowrap;
    }
    .gap-resolver-pill {
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #4b5563;
    }
    html.dark .gap-resolver-pill {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #d1d5db;
    }
    .gap-resolver-pill-match {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #15803d;
    }
    html.dark .gap-resolver-pill-match {
        border-color: rgba(74, 222, 128, 0.22);
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
    }
    .gap-resolver-pill-pack {
        border-color: #fde68a;
        background: #fffbeb;
        color: #b45309;
    }
    html.dark .gap-resolver-pill-pack {
        border-color: rgba(251, 191, 36, 0.24);
        background: rgba(251, 191, 36, 0.12);
        color: #fcd34d;
    }
    .gap-resolver-pill-muted {
        color: #6b7280;
    }
    html.dark .gap-resolver-pill-muted {
        color: #9ca3af;
    }
    .gap-resolver-pill-official {
        border-color: #fde68a;
        background: #fffbeb;
        color: #b45309;
    }
    html.dark .gap-resolver-pill-official {
        border-color: rgba(251, 191, 36, 0.24);
        background: rgba(251, 191, 36, 0.12);
        color: #fcd34d;
    }
    .gap-resolver-remark {
        max-height: 64px;
        margin-top: 10px;
        overflow-y: auto;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #f9fafb;
        padding: 8px 10px;
        color: #374151;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.55;
        overflow-wrap: anywhere;
    }
    html.dark .gap-resolver-remark {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.18);
        color: #e5e7eb;
    }
    .gap-resolver-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 104px;
        min-height: 36px;
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
    }
    .gap-files-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .gap-files-summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .gap-files-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-left: auto;
    }
    .gap-files-summary button,
    .gap-files-summary span,
    .gap-file-status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 900;
        line-height: 1.2;
        white-space: nowrap;
    }
    .gap-files-summary button {
        transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
    }
    .gap-files-summary button:active {
        transform: scale(0.97);
    }
    .gap-files-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 30px;
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
        transition: transform 140ms ease, background-color 140ms ease, color 140ms ease;
    }
    .gap-files-action:active {
        transform: scale(0.97);
    }
    .gap-files-action:disabled {
        cursor: not-allowed;
        opacity: 0.52;
        transform: none;
    }
    .gap-files-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .gap-files-season {
        overflow: hidden;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    html.dark .gap-files-season {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: none;
    }
    .gap-files-season-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 12px;
        border-bottom: 1px solid #e5e7eb;
        background: #f9fafb;
    }
    html.dark .gap-files-season-head {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
    }
    .gap-file-row {
        display: grid;
        grid-template-columns: max-content minmax(14rem, 0.78fr) minmax(26rem, 1.52fr);
        gap: clamp(0.75rem, 1dvw, 1rem);
        align-items: stretch;
        padding: 0.625rem clamp(0.75rem, 1dvw, 1rem);
        transition: background-color 140ms ease;
    }
    .gap-file-row:hover {
        background: #f8fafc;
    }
    html.dark .gap-file-row:hover {
        background: rgba(255, 255, 255, 0.035);
    }
    .gap-file-row + .gap-file-row {
        border-top: 1px solid #f3f4f6;
    }
    html.dark .gap-file-row + .gap-file-row {
        border-color: rgba(255, 255, 255, 0.08);
    }
    .gap-file-episode-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
    }
    .gap-file-title-col {
        min-width: 0;
        padding-top: 2px;
    }
    .gap-file-title-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        min-width: 0;
    }
    .gap-file-source-col {
        min-width: 0;
    }
    .gap-file-title,
    .gap-file-name,
    .gap-file-path {
        overflow-wrap: anywhere;
        word-break: break-word;
    }
    .gap-file-title {
        line-height: 1.35;
    }
    .gap-file-source {
        border-radius: 12px;
        border: 1px solid #dbe3ef;
        background: #f8fafc;
        padding: 9px 11px;
    }
    html.dark .gap-file-source {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.16);
    }
    .gap-file-source + .gap-file-source {
        margin-top: 6px;
    }
    .gap-file-name {
        color: #0f172a;
        font-size: 12px;
        font-weight: 900;
        line-height: 1.35;
    }
    html.dark .gap-file-name {
        color: #f8fafc;
    }
    .gap-file-path {
        margin-top: 4px;
        color: #64748b;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1.55;
    }
    html.dark .gap-file-path {
        color: #94a3b8;
    }
    .gap-file-meta {
        margin-top: 4px;
        color: #94a3b8;
        font-size: 10.5px;
        font-weight: 800;
    }
    .gap-toolbar {
        position: sticky;
        top: 72px;
        z-index: 30;
    }
    .gap-stat-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .gap-results-grid {
        display: grid;
        grid-template-columns: repeat(var(--gap-column-count, 1), minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
    }
    .gap-library-results {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }
    .gap-library-section {
        min-width: 0;
        container-type: inline-size;
    }
    .gap-library-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 4px 8px;
    }
    .gap-library-switch {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 1px;
    }
    .gap-library-switch button {
        flex: 0 0 auto;
    }
    .gap-card {
        --gap-card-height: 216px;
        --gap-season-window-height: 54px;
        display: flex;
        flex-direction: column;
        height: var(--gap-card-height);
        overflow: hidden;
    }
    .gap-series-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        height: 100%;
    }
    .gap-series-info {
        flex-shrink: 0;
        min-width: 0;
        overflow: hidden;
    }
    .gap-series-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
    }
    .gap-series-title {
        min-width: 0;
        flex: 1 1 auto;
        display: flex;
        align-items: flex-start;
        gap: 6px;
    }
    .gap-series-title-text {
        display: -webkit-box;
        max-width: 100%;
        overflow: hidden;
        overflow-wrap: anywhere;
        word-break: break-word;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        line-height: 1.25;
    }
    .gap-title-line {
        min-width: 0;
        flex: 1 1 auto;
    }
    .gap-anomaly-dot {
        width: 7px;
        height: 7px;
        margin-top: 4px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
        flex: 0 0 auto;
    }
    .gap-chip-anomaly-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.14);
        flex: 0 0 auto;
    }
    .gap-series-actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
    }
    .gap-series-seasons {
        flex: 0 0 var(--gap-season-window-height);
        min-height: var(--gap-season-window-height);
        max-height: var(--gap-season-window-height);
        overflow-y: auto;
        padding-right: 2px;
    }
    .gap-series-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
    }
    .gap-series-meta span {
        min-width: 0;
        max-width: 100%;
    }
    .gap-series-meta a {
        display: inline-flex;
        align-items: center;
        color: inherit;
        text-decoration: none;
        transition: color 140ms ease;
    }
    .gap-series-meta a:hover {
        color: #007AFF;
    }
    .gap-missing-meta {
        min-height: 20px;
    }
    .gap-season-row {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 44px;
        overflow: hidden;
    }
    .gap-episode-grid {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 8px 1px 0;
        scroll-padding-inline: 8px;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
    }
    .gap-episode-compact {
        min-height: 32px;
        max-width: 100%;
        flex: 0 0 auto;
    }
    .gap-episode-chip {
        flex: 0 0 auto;
    }
    @media (min-width: 1280px) {
        .gap-results-grid { --gap-column-count: 2; }
        .gap-card { --gap-card-height: 212px; --gap-season-window-height: 54px; }
    }
    @media (min-width: 1440px) {
        .gap-results-grid { --gap-column-count: 3; }
        .gap-card { --gap-card-height: 216px; --gap-season-window-height: 54px; }
    }
    @media (min-width: 1900px) {
        .gap-card { --gap-card-height: 220px; }
    }
    @container (min-width: 760px) {
        .gap-results-grid { --gap-column-count: 2; }
        .gap-card { --gap-card-height: 212px; --gap-season-window-height: 54px; }
    }
    @container (min-width: 1180px) {
        .gap-results-grid { --gap-column-count: 3; }
        .gap-card { --gap-card-height: 216px; --gap-season-window-height: 54px; }
    }
    @container (min-width: 1600px) {
        .gap-card { --gap-card-height: 220px; }
    }
    @media (max-width: 1023px) {
        .gap-card { --gap-card-height: 220px; --gap-season-window-height: 54px; }
        .gap-file-row { grid-template-columns: max-content minmax(0, 1fr); }
        .gap-file-source-col { grid-column: 1 / -1; }
    }
    @media (max-width: 640px) {
        .gap-shell { padding-left: 12px; padding-right: 12px; }
        .gap-stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gap-toolbar { top: 72px; }
        .gap-poster { width: 56px; height: 84px; }
        .gap-library-header { align-items: flex-start; flex-direction: column; }
        .gap-library-switch { margin-left: -2px; margin-right: -2px; padding-left: 2px; padding-right: 2px; }
        .gap-resolver-main { grid-template-columns: minmax(0, 1fr); }
        .gap-resolver-action { width: 100%; }
        .gap-files-summary-row { align-items: stretch; flex-direction: column; }
        .gap-files-actions { justify-content: flex-start; margin-left: 0; }
        .gap-file-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
        .gap-file-source-col { grid-column: auto; }
    }
</style>
{% endblock %}
{% block content %}
<div class="gap-shell mx-auto w-full px-4 md:px-8 py-5 pb-24">
    <div class="apple-card p-4 mb-3">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-cyan-50 dark:bg-cyan-500/15 border border-cyan-100 dark:border-cyan-500/20 flex items-center justify-center text-cyan-500 shrink-0">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-lg font-black text-gray-900 dark:text-white">缺集管理</h1>
                    <div class="flex flex-wrap items-center gap-2 mt-1 text-[11px] text-gray-500 dark:text-gray-400 font-medium">
                        <span id="gapCacheTime">等待扫描</span>
                        <span class="w-1 h-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
                        <span id="gapLibraryCount">剧集库 0</span>
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap lg:flex-nowrap lg:justify-end items-center gap-2">
                <button onclick="openGapConfig()" class="px-3 py-2 rounded-xl bg-gray-100 dark:bg-apple-hoverDark hover:bg-gray-200 dark:hover:bg-[#3A3A3C] text-gray-600 dark:text-gray-300 text-xs font-bold transition-colors border border-gray-200 dark:border-white/5 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i><span>设置</span>
                </button>
                <button onclick="openGapIgnores()" class="px-3 py-2 rounded-xl bg-gray-100 dark:bg-apple-hoverDark hover:bg-gray-200 dark:hover:bg-[#3A3A3C] text-gray-600 dark:text-gray-300 text-xs font-bold transition-colors border border-gray-200 dark:border-white/5 flex items-center gap-2">
                    <i class="fa-solid fa-box-archive"></i><span>忽略列表</span>
                </button>
                <button id="gapScanBtn" onclick="startGapScan()" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold transition-all active:scale-95 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i><span>扫描缺集</span>
                </button>
            </div>
        </div>
        <div class="gap-stat-strip mt-4 rounded-2xl overflow-hidden border border-gray-100 dark:border-white/10 bg-gray-50/70 dark:bg-white/5 divide-x divide-y sm:divide-y-0 divide-gray-200/70 dark:divide-white/10">
            <div class="px-4 py-3">
                <div class="text-[10px] font-black text-gray-400 dark:text-gray-500 mb-0.5">缺集剧集</div>
                <div id="statSeries" class="text-xl font-black text-gray-900 dark:text-white leading-none">0</div>
            </div>
            <div class="px-4 py-3">
                <div class="text-[10px] font-black text-gray-400 dark:text-gray-500 mb-0.5">缺口总数</div>
                <div id="statGaps" class="text-xl font-black text-cyan-500 leading-none">0</div>
            </div>
            <div class="px-4 py-3">
                <div class="text-[10px] font-black text-gray-400 dark:text-gray-500 mb-0.5">已处理</div>
                <div id="statProcessed" class="text-xl font-black text-gray-900 dark:text-white leading-none">0</div>
            </div>
            <div class="px-4 py-3">
                <div class="text-[10px] font-black text-gray-400 dark:text-gray-500 mb-0.5">扫描状态</div>
                <div id="statState" class="text-sm font-black text-gray-900 dark:text-white truncate">空闲</div>
            </div>
        </div>
    </div>

    <div id="gapProgressCard" class="hidden apple-card p-4 mb-5">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-circle-notch fa-spin text-brand-500 text-lg"></i>
            <div class="flex-1 min-w-0">
                <div id="gapProgressText" class="text-sm font-bold text-gray-700 dark:text-gray-200 truncate">扫描中...</div>
                <div class="mt-2 bg-gray-100 dark:bg-apple-hoverDark rounded-full h-2 overflow-hidden">
                    <div id="gapProgressBar" class="bg-cyan-500 h-full rounded-full transition-all duration-300" style="width:0%"></div>
                </div>
            </div>
            <span id="gapProgressPct" class="text-xs text-gray-500 font-mono w-12 text-right">0%</span>
        </div>
    </div>

    <div class="gap-toolbar apple-blur rounded-2xl border border-white/60 dark:border-white/10 bg-white/80 dark:bg-apple-cardDark/80 p-3 mb-3 shadow-sm">
        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input id="gapSearchInput" oninput="renderGapResults()" class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-gray-50 dark:bg-apple-hoverDark border border-gray-200 dark:border-white/10 text-sm font-medium outline-none focus:ring-2 focus:ring-brand-500" placeholder="筛选剧名、TMDB、媒体库">
            </div>
            <select id="gapSortSelect" onchange="renderGapResults()" class="px-3 py-2.5 rounded-xl bg-gray-50 dark:bg-apple-hoverDark border border-gray-200 dark:border-white/10 text-sm font-bold outline-none focus:ring-2 focus:ring-brand-500">
                <option value="gap_desc">缺口最多</option>
                <option value="name_asc">剧名 A-Z</option>
                <option value="library_asc">媒体库</option>
            </select>
        </div>
        <div id="gapLibrarySwitch" class="gap-library-switch mac-scrollbar mt-3"></div>
    </div>

    <div id="gapLoading" class="text-center py-24 text-gray-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-brand-500"></i>
        <p class="text-sm font-bold">正在加载缺集缓存...</p>
    </div>

<script>
const gapState = {
    items: [],
    summary: {},
    activeLibrary: '',
    pending: null,
    source: '',
    resolverResults: [],
    resolverOpen: false,
    resolverToken: 0,
    pollTimer: null,
    refreshingSeries: new Set(),
    subscribingSeries: new Set(),
    fileData: null,
    fileFilter: 'all',
    scanMonitor: null,
    scanStatus: {},
    downloadStatusToken: 0,
};
const GAP_EMBY_EXTERNAL_BASE = 'https://emby.ikirito.de';
let gapEmbyServerId = '';
const gapModalHideTimers = new Map();

document.addEventListener('DOMContentLoaded', () => {
    loadGapStatus();
    loadGapEmbyConfig().then(() => {
        if (gapState.items.length) renderGapResults();
    });
});

async function gapApi(url, options = {}) {
    const res = await fetch(url, options);
    const data = await res.json();
    if (data.status === 'error') throw new Error(data.message || '请求失败');
    return data;
}

async function loadSharedScanMonitor() {
    try {
        const data = await gapApi(`/api/scan/status?_t=${Date.now()}`);
        return data.data || null;
    } catch (_) {
        return null;
    }
}

function showGapModal(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const hideTimer = gapModalHideTimers.get(id);
    if (hideTimer) {
        clearTimeout(hideTimer);
        gapModalHideTimers.delete(id);
    }
    el.classList.remove('hidden');
    void el.offsetWidth;
    el.classList.remove('opacity-0');
}

function hideGapModal(id, afterHidden = null) {
    const el = document.getElementById(id);
    if (!el) return;
    const hideTimer = gapModalHideTimers.get(id);
    if (hideTimer) clearTimeout(hideTimer);
    el.classList.add('opacity-0');
    gapModalHideTimers.set(id, setTimeout(() => {
        el.classList.add('hidden');
        gapModalHideTimers.delete(id);
        if (typeof afterHidden === 'function') requestAnimationFrame(afterHidden);
    }, 180));
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function jsString(value) {
    return JSON.stringify(String(value ?? '')).replace(/</g, '\\u003c');
}

async function loadGapEmbyConfig() {
    try {
        const data = await gapApi(`/api/config?_t=${Date.now()}`);
        gapEmbyServerId = data.data?.emby_server_id || '';
    } catch (e) {
        gapEmbyServerId = '';
    }
}

function embySeriesUrl(seriesId) {
    const id = String(seriesId || '').trim();
    if (!id) return '';
    const query = new URLSearchParams({ id });
    if (gapEmbyServerId) query.set('serverId', gapEmbyServerId);
    return `${GAP_EMBY_EXTERNAL_BASE}/web/index.html#!/item?${query.toString()}`;
}

function tmdbSeriesUrl(tmdbId) {
    const id = String(tmdbId || '').trim();
    if (!id) return '';
    return `https://www.themoviedb.org/tv/${encodeURIComponent(id)}`;
}

function formatBytes(value) {
    if (typeof value === 'string') {
        if (/[kmgt]b/i.test(value)) return value;
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) return value || '未知';
        value = parsed;
    }
    const num = Number(value || 0);
    if (!num) return '未知';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let size = num;
    let idx = 0;
    while (size >= 1024 && idx < units.length - 1) {
        size /= 1024;
        idx += 1;
    }
    return `${size.toFixed(idx >= 3 ? 2 : 1)} ${units[idx]}`;
}

function formatDownloaderSpeed(value) {
    const speed = Number(value || 0);
    if (!Number.isFinite(speed) || speed <= 0) return '';
    return `${formatBytes(speed)}/s`;
}

function gapTransferStatus(item) {
    return String(item?.ui_transfer_status || item?.status || '').trim().toLowerCase();
}

function isGapTransferSuccess(status) {
    return ['transferred', 'already_owned', 'success', 'ok', 'unlocked'].includes(String(status || '').trim().toLowerCase());
}

function isGapTransferredStatus(status) {
    return ['transferred', 'success', 'ok'].includes(String(status || '').trim().toLowerCase());
}

function isGapTransferDone(item) {
    const status = gapTransferStatus(item);
    return status === 'already_owned' || isGapTransferredStatus(status);
}

function isUnlockedResource(item) {
    const status = gapTransferStatus(item);
    return item?.is_unlocked === true
        || item?.ui_unlocked === true
        || status === 'transferred'
        || status === 'already_owned'
        || status === 'unlocked'
        || (item?.ui_transfer_marked === true && isGapTransferSuccess(status));
}

function isUnlockedOnlyResource(item) {
    const status = gapTransferStatus(item);
    return isUnlockedResource(item)
        && status !== 'already_owned'
        && status !== 'submitted'
        && !isGapTransferredStatus(status);
}

function unlockedResourceLabel(item) {
    return '已解锁';
}

function unlockedResourceBadgeClass(item) {
    return 'bg-amber-400 text-gray-950 shadow-sm shadow-amber-400/30 ring-1 ring-amber-200/60';
}

function gapResolverAction(item) {
    if (item?.ui_transfer_pending === true) {
        return {
            label: '正在转存',
            icon: 'fa-solid fa-circle-notch fa-spin',
            className: 'bg-sky-500 text-white shadow-sm shadow-sky-500/30 cursor-wait',
            disabled: true,
        };
    }
    const status = gapTransferStatus(item);
    const matchKind = String(item?.ui_episode_match_kind || '');
    if (isGapTransferDone(item)) {
        return {
            label: '重新转存',
            icon: 'fa-solid fa-rotate',
            className: 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm shadow-blue-500/30 active:scale-95',
            disabled: false,
            title: status === 'already_owned' ? '资源已在 115，仍会重新提交转存' : '该资源已有转存记录，仍会强制重新提交转存',
        };
    }
    if (item?.ui_download_blocked === true || matchKind === 'none') {
        return {
            label: '不匹配',
            icon: 'fa-solid fa-ban',
            className: 'bg-gray-200 hover:bg-gray-300 text-gray-600 dark:bg-white/10 dark:hover:bg-white/15 dark:text-gray-300 shadow-sm shadow-gray-300/20 active:scale-95',
            disabled: false,
            title: item?.ui_download_block_reason || '不匹配，点击仍会强制提交',
        };
    }
    if (isUnlockedOnlyResource(item)) {
        return {
            label: '转存',
            icon: 'fa-solid fa-cloud-arrow-down',
            className: 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-sm shadow-emerald-500/25 active:scale-95',
            disabled: false,
            title: '资源已解锁，提交转存到 115',
        };
    }
    return {
        label: '解锁转存',
        icon: 'fa-solid fa-cloud-arrow-down',
        className: 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-sm shadow-emerald-500/25 active:scale-95',
        disabled: false,
        title: '解锁后转存到 115',
    };
}

function moviepilotDownloadTaskAction(item) {
    const status = String(item?.ui_download_status || '').trim().toLowerCase();
    const baseLabel = item?.ui_download_label || '已在下载器';
    const progress = Number(item?.ui_download_progress || 0);
    const speed = formatDownloaderSpeed(item?.ui_download_speed);
    const showProgress = ['downloading', 'stalled', 'queued', 'checking'].includes(status) && progress > 0 && progress < 1;
    const label = showProgress ? `${baseLabel} ${Math.round(progress * 100)}%` : baseLabel;
    const titleParts = [
        item?.ui_downloader ? `下载器: ${item.ui_downloader}` : '',
        item?.ui_download_name ? `任务: ${item.ui_download_name}` : '',
        speed ? `速度: ${speed}` : '',
    ].filter(Boolean);
    const title = titleParts.join(' · ') || '下载器中已有该任务';
    if (status === 'completed') {
        return {
            label,
            icon: 'fa-solid fa-circle-check',
            className: 'bg-emerald-500 text-white shadow-sm shadow-emerald-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    if (status === 'paused') {
        return {
            label,
            icon: 'fa-solid fa-circle-pause',
            className: 'bg-amber-500 text-white shadow-sm shadow-amber-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    if (status === 'error') {
        return {
            label,
            icon: 'fa-solid fa-triangle-exclamation',
            className: 'bg-red-500 text-white shadow-sm shadow-red-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    if (status === 'queued' || status === 'checking' || status === 'stalled') {
        return {
            label,
            icon: 'fa-solid fa-clock',
            className: 'bg-slate-500 text-white shadow-sm shadow-slate-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    return {
        label,
        icon: 'fa-solid fa-circle-down',
        className: 'bg-sky-500 text-white shadow-sm shadow-sky-500/25 cursor-default',
        disabled: true,
        title,
    };
}

function moviepilotResolverAction(item) {
    const matchKind = String(item?.ui_episode_match_kind || '');
    const downloadMode = String(item?.ui_download_mode || '');
    const pending = gapState.pending || {};
    const pendingFullSeries = pending.fullSeries === true;
    const pendingTargets = Array.isArray(pending.targets) ? pending.targets : [];
    const pendingSeasonOnly = pendingTargets.length > 0 && pendingTargets.every(target => (
        target?.season_missing === true && !(Array.isArray(target?.episodes) && target.episodes.length)
    ));
    const itemTargets = Array.isArray(item?.ui_gap_targets) ? item.ui_gap_targets : [];
    const itemSeasonOnly = itemTargets.some(target => (
        target?.season_missing === true || (target?.match_kind === 'season_pack' && !(Array.isArray(target?.episodes) && target.episodes.length))
    ));
    const forceDirect = pendingFullSeries || (matchKind === 'season_pack' && (pendingSeasonOnly || itemSeasonOnly || downloadMode === 'normal'));
    const shouldSplit = !forceDirect && (downloadMode === 'split' || (!downloadMode && ['episode_pack', 'season_pack'].includes(matchKind)));
    if (item?.ui_transfer_pending === true) {
        const pendingLabel = shouldSplit ? '正在拆包' : '正在下载';
        return {
            label: pendingLabel,
            icon: 'fa-solid fa-circle-notch fa-spin',
            className: 'bg-sky-500 text-white shadow-sm shadow-sky-500/30 cursor-wait',
            disabled: true,
            title: '正在提交下载任务',
        };
    }
    if (item?.ui_download_task === true) {
        return moviepilotDownloadTaskAction(item);
    }
    if (item?.ui_download_blocked === true || matchKind === 'none') {
        return {
            label: '不匹配',
            icon: 'fa-solid fa-ban',
            className: 'bg-gray-200 hover:bg-gray-300 text-gray-600 dark:bg-white/10 dark:hover:bg-white/15 dark:text-gray-300 shadow-sm shadow-gray-300/20 active:scale-95',
            disabled: false,
            title: item?.ui_download_block_reason || '不匹配，点击仍会强制提交',
        };
    }
    if (shouldSplit) {
        return {
            label: '拆包下载',
            icon: 'fa-solid fa-list-check',
            className: 'bg-indigo-500 hover:bg-indigo-600 text-white shadow-sm shadow-indigo-500/25 active:scale-95',
            disabled: false,
            title: item?.ui_download_hint || '提交后只选择缺失集数文件',
        };
    }
    if (pendingFullSeries || matchKind === 'full_series' || item?.ui_full_series === true) {
        return {
            label: '下载全集',
            icon: 'fa-solid fa-download',
            className: 'bg-amber-500 hover:bg-amber-600 text-white shadow-sm shadow-amber-500/25 active:scale-95',
            disabled: false,
            title: '下载全集资源',
        };
    }
    if (matchKind === 'season_pack') {
        return {
            label: '下载整季',
            icon: 'fa-solid fa-download',
            className: 'bg-brand-500 hover:bg-brand-600 text-white active:scale-95',
            disabled: false,
            title: item?.ui_download_hint || '提交 MoviePilot 下载整季资源',
        };
    }
    return {
        label: '下载',
        icon: 'fa-solid fa-download',
        className: 'bg-brand-500 hover:bg-brand-600 text-white active:scale-95',
        disabled: false,
        title: '下载缺失集数',
    };
}

function episodeLabel(season, episode) {
    if (Number(episode || 0) <= 0) return `S${String(season).padStart(2, '0')}`;
    return `S${String(season).padStart(2, '0')}E${String(episode).padStart(2, '0')}`;
}

function isSeasonMissingGap(item) {
    return item?.season_missing === true || String(item?.source || '') === 'season_inferred' || Number(item?.episode || 0) <= 0;
}

function isGapAnomaly(item) {
    return item?.anomaly === true || Boolean(item?.anomaly_type);
}

function seriesGapAnomalies(series) {
    return (series?.gaps || []).filter(isGapAnomaly);
}

function gapAnomalyText(item) {
    return item?.anomaly_message || '本地季号与 TMDB 季信息不一致，可能是入库季号错误';
}

function seriesAnomalyText(series) {
    const anomalies = seriesGapAnomalies(series);
    if (!anomalies.length) return '';
    return anomalies.map(gap => `S${String(gap.season || 0).padStart(2, '0')}: ${gapAnomalyText(gap)}`).join('；');
}

function gapMissingSummary(series) {
    const gaps = Array.isArray(series?.gaps) ? series.gaps : [];
    const seasonCount = gaps.filter(isSeasonMissingGap).length;
    const episodeCount = gaps.length - seasonCount;
    if (seasonCount && episodeCount) return `缺 ${episodeCount} 集/${seasonCount} 季`;
    if (seasonCount) return `缺 ${seasonCount} 季`;
    return `缺 ${episodeCount} 集`;
}

function groupGaps(series) {
    const grouped = {};
    (series.gaps || []).forEach(ep => {
        const season = Number(ep.season || 0);
        if (!grouped[season]) grouped[season] = [];
        grouped[season].push(ep);
    });
    return Object.keys(grouped).map(season => ({
        season: Number(season),
        episodes: grouped[season].sort((a, b) => Number(a.episode) - Number(b.episode)),
    })).sort((a, b) => a.season - b.season);
}

function seriesGapTargets(series) {
    const targets = [];
    groupGaps(series).forEach(group => {
        const season = Number(group.season || 0);
        if (group.episodes.some(isSeasonMissingGap)) {
            targets.push({season, episodes: [], season_missing: true});
        }
        const episodes = group.episodes
            .filter(ep => !isSeasonMissingGap(ep))
            .map(ep => Number(ep.episode || 0))
            .filter(Boolean);
        if (episodes.length) targets.push({season, episodes});
    });
    return targets;
}

function episodeListText(episodes) {
    const nums = (episodes || []).map(v => Number(v || 0)).filter(Boolean).sort((a, b) => a - b);
    if (!nums.length) return '';
    if (nums.length > 1 && nums.every((num, idx) => idx === 0 || num === nums[idx - 1] + 1)) {
        return `E${String(nums[0]).padStart(2, '0')}-E${String(nums[nums.length - 1]).padStart(2, '0')}`;
    }
    return nums.slice(0, 8).map(e => `E${String(e).padStart(2, '0')}`).join(', ') + (nums.length > 8 ? ` +${nums.length - 8}` : '');
}

function gapTargetLabel(targets) {
    const items = (targets || []).filter(target => target.season_missing === true || (target.episodes || []).length);
    if (!items.length) return '全部缺失';
    const parts = items.slice(0, 4).map(target => (
        target.season_missing === true && !(target.episodes || []).length
            ? `S${String(target.season).padStart(2, '0')} 整季`
            : `S${String(target.season).padStart(2, '0')} ${episodeListText(target.episodes)}`
    ));
    return parts.join(' / ') + (items.length > 4 ? ` / +${items.length - 4}季` : '');
}

async function loadGapStatus() {
    try {
        const [gapData, scanMonitor] = await Promise.all([
            gapApi('/api/gaps/scan/progress'),
            loadSharedScanMonitor(),
        ]);
        gapState.scanMonitor = scanMonitor;
        applyGapStatus(gapData.data || {});
    } catch (e) {
        document.getElementById('gapLoading').classList.add('hidden');
        showToast('error', '加载失败', e.message);
    }
}

function applyGapStatus(status) {
    const running = !!status.is_scanning;
    gapState.scanStatus = status || {};
    gapState.items = Array.isArray(status.results) ? status.results : [];
    gapState.summary = status.summary || {};
    document.getElementById('gapLoading').classList.add('hidden');
    const emptyText = document.querySelector('#gapEmpty p');
    if (emptyText) {
        emptyText.textContent = running ? '扫描中，缺集记录会陆续出现' : '暂无缺集记录';
    }
    updateGapStats(status);
    updateGapProgress(status);
    renderGapLibrarySwitch();
    renderGapResults();
    if (running && !gapState.pollTimer) startGapPolling();
}

function updateGapStats(status = {}) {
    const summary = gapState.summary || {};
    const seriesCount = summary.series_count ?? gapState.items.length;
    const gapCount = summary.gap_count ?? gapState.items.reduce((sum, item) => sum + (item.gaps || []).length, 0);
    const processed = summary.processed ?? status.processed ?? 0;
    const total = summary.total ?? status.total ?? 0;
    document.getElementById('statSeries').textContent = seriesCount;
    document.getElementById('statGaps').textContent = gapCount;
    document.getElementById('statProcessed').textContent = status.is_scanning && total ? `${processed}/${total}` : processed;
    document.getElementById('statState').textContent = status.is_scanning ? '扫描中' : (status.error ? '异常' : '空闲');
    document.getElementById('gapLibraryCount').textContent = `剧集库 ${summary.library_count ?? 0}`;
    const scanMonitor = gapState.scanMonitor || {};
    const scanSummary = scanMonitor.summary || {};
    const scanTime = scanMonitor.scan_time || scanSummary.scan_time || scanMonitor.cache?.created_at || '';
    const scanTimeEl = document.getElementById('gapCacheTime');
    if (scanTime) {
        scanTimeEl.textContent = `上次扫描: ${scanTime}`;
        const nextScan = scanMonitor.schedule?.next_scan;
        scanTimeEl.title = nextScan ? `下次定时扫描: ${nextScan}` : '与仪表盘同步的扫描时间';
    } else if (status.created_at) {
        scanTimeEl.textContent = `缺集扫描: ${status.created_at}`;
        scanTimeEl.title = '缺集缓存更新时间';
    } else {
        scanTimeEl.textContent = '等待扫描';
        scanTimeEl.removeAttribute('title');
    }
}

function updateGapProgress(status = {}) {
    const card = document.getElementById('gapProgressCard');
    const scanBtn = document.getElementById('gapScanBtn');
    const running = !!status.is_scanning;
    card.classList.toggle('hidden', !running && !status.error);
    scanBtn.disabled = running;
    scanBtn.classList.toggle('opacity-60', running);
    const progress = Math.max(0, Math.min(100, Number(status.progress || 0)));
    document.getElementById('gapProgressBar').style.width = `${progress}%`;
    document.getElementById('gapProgressPct').textContent = `${progress}%`;
    document.getElementById('gapProgressText').textContent = status.error || status.current_item || '扫描中...';
}

async function startGapScan() {
    try {
        await gapApi('/api/gaps/scan/start', { method: 'POST' });
        showToast('success', '已启动扫描');
        startGapPolling();
    } catch (e) {
        showToast('error', '启动失败', e.message);
    }
}

async function refreshGapSeries(seriesId) {
    const id = String(seriesId || '').trim();
    if (!id || gapState.refreshingSeries.has(id)) return;
    gapState.refreshingSeries.add(id);
    renderGapResults();
    try {
        const data = await gapApi('/api/gaps/refresh_series', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ series_id: id }),
        });
        const status = (data.data || {}).status;
        if (status) {
            applyGapStatus(status);
        } else {
            await loadGapStatus();
        }
        showToast('success', '刷新完成', data.message || '该剧缺集数据已更新');
    } catch (e) {
        showToast('error', '刷新失败', e.message);
    } finally {
        gapState.refreshingSeries.delete(id);
        renderGapResults();
    }
}

function startGapPolling() {
    if (gapState.pollTimer) {
        clearInterval(gapState.pollTimer);
        gapState.pollTimer = null;
    }
    const tick = async () => {
        try {
            const data = await gapApi(`/api/gaps/scan/progress?_t=${Date.now()}`);
            applyGapStatus(data.data || {});
            if (!data.data?.is_scanning) {
                clearInterval(gapState.pollTimer);
                gapState.pollTimer = null;
            }
        } catch (e) {
            clearInterval(gapState.pollTimer);
            gapState.pollTimer = null;
            showToast('error', '轮询失败', e.message);
        }
    };
    tick();
    gapState.pollTimer = setInterval(tick, 1000);
}

function filteredGapItems() {
    const keyword = (document.getElementById('gapSearchInput')?.value || '').trim().toLowerCase();
    let items = [...gapState.items];
    if (gapState.activeLibrary) {
        items = items.filter(item => gapLibraryName(item) === gapState.activeLibrary);
    }
    if (keyword) {
        items = items.filter(item => [
            item.series_name, item.tmdb_id, item.imdb_id, item.library_name
        ].some(v => String(v || '').toLowerCase().includes(keyword)));
    }
    return items;
}

function sortGapItems(items, sort) {
    items = [...items];
    if (sort === 'name_asc') {
        items.sort((a, b) => String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN'));
    } else if (sort === 'library_asc') {
        items.sort((a, b) => (
            String(a.library_name || '').localeCompare(String(b.library_name || ''), 'zh-CN')
            || String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN')
        ));
    } else {
        items.sort((a, b) => (
            (b.gaps || []).length - (a.gaps || []).length
            || String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN')
        ));
    }
    return items;
}

function gapLibraryName(series) {
    return String(series.library_name || '').trim() || '未分类媒体库';
}

function gapLibraryStats() {
    const grouped = new Map();
    gapState.items.forEach(item => {
        const library = gapLibraryName(item);
        if (!grouped.has(library)) grouped.set(library, { library, seriesCount: 0, gapCount: 0 });
        const stat = grouped.get(library);
        stat.seriesCount += 1;
        stat.gapCount += (item.gaps || []).length;
    });
    return Array.from(grouped.values()).sort((a, b) => a.library.localeCompare(b.library, 'zh-CN'));
}

function renderGapLibrarySwitch() {
    const container = document.getElementById('gapLibrarySwitch');
    if (!container) return;
    const stats = gapLibraryStats();
    if (gapState.activeLibrary && !stats.some(item => item.library === gapState.activeLibrary)) {
        gapState.activeLibrary = '';
    }
    const total = {
        library: '',
        label: '全部',
        seriesCount: gapState.items.length,
        gapCount: gapState.items.reduce((sum, item) => sum + (item.gaps || []).length, 0),
    };
    const buttons = [total, ...stats.map(item => ({ ...item, label: item.library }))];
    container.innerHTML = buttons.map(item => {
        const active = item.library === gapState.activeLibrary;
        const activeClass = active
            ? 'bg-brand-500 border-brand-500 text-white shadow-sm'
            : 'bg-gray-50 dark:bg-apple-hoverDark border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-white/10 hover:text-brand-500';
        return `
            <button type="button" aria-pressed="${active ? 'true' : 'false'}" onclick='setGapLibraryFilter(${jsString(item.library)})' class="px-3 py-2 rounded-xl border ${activeClass} text-xs font-black transition-all active:scale-95">
                <span>${escapeHtml(item.label)}</span>
                <span class="${active ? 'text-white/75' : 'text-gray-400 dark:text-gray-500'} ml-1">${item.seriesCount}/${item.gapCount}</span>
            </button>
        `;
    }).join('');
}

function setGapLibraryFilter(library) {
    gapState.activeLibrary = String(library || '');
    renderGapLibrarySwitch();
    renderGapResults();
    document.getElementById('gapResults')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function groupItemsByLibrary(items) {
    const sort = document.getElementById('gapSortSelect')?.value || 'gap_desc';
    const grouped = new Map();
    items.forEach(item => {
        const library = gapLibraryName(item);
        if (!grouped.has(library)) grouped.set(library, []);
        grouped.get(library).push(item);
    });
    return Array.from(grouped.entries()).map(([library, series]) => ({
        library,
        series: sortGapItems(series, sort === 'library_asc' ? 'name_asc' : sort),
        gapCount: series.reduce((sum, item) => sum + (item.gaps || []).length, 0),
    })).sort((a, b) => a.library.localeCompare(b.library, 'zh-CN'));
}

function compactEpisodeRange(episodes) {
    if (!Array.isArray(episodes) || episodes.length < 6) return null;
    const numbers = episodes.map(ep => Number(ep.episode || 0));
    if (numbers.some(num => !Number.isInteger(num) || num <= 0)) return null;
    const unique = new Set(numbers);
    if (unique.size !== numbers.length) return null;
    const sorted = [...numbers].sort((a, b) => a - b);
    for (let i = 1; i < sorted.length; i += 1) {
        if (sorted[i] !== sorted[i - 1] + 1) return null;
    }
    return {
        start: sorted[0],
        end: sorted[sorted.length - 1],
        count: sorted.length,
        isPending: episodes.every(ep => Number(ep.status) === 2),
    };
}

function compactRangeLabel(range) {
    return `E${String(range.start).padStart(2, '0')}-E${String(range.end).padStart(2, '0')}`;
}

function renderGapEpisodeButtons(series, group, episodeCsv) {
    if (group.episodes.some(isSeasonMissingGap)) {
        return group.episodes.map(ep => {
            if (!isSeasonMissingGap(ep)) return '';
            const anomaly = isGapAnomaly(ep);
            const chipClass = anomaly
                ? 'bg-red-50 dark:bg-red-500/10 border-red-200 dark:border-red-500/25 text-red-700 dark:text-red-300'
                : 'bg-amber-50 dark:bg-amber-500/10 border-amber-200 dark:border-amber-500/20 text-amber-700 dark:text-amber-300';
            const chipTitle = anomaly ? `数据异常：${gapAnomalyText(ep)}` : '搜索整季缺失';
            return `
                <div class="gap-episode-chip inline-flex items-center rounded-lg border ${chipClass} overflow-hidden">
                    <button title="${escapeHtml(chipTitle)}" class="gap-chip inline-flex items-center gap-1.5 px-2 text-[11px] font-black hover:text-brand-500 hover:bg-white/60 dark:hover:bg-white/10 transition-colors" onclick='openGapSourceSeason(${jsString(series.series_id)}, ${Number(ep.season || group.season || 0)})'>
                        ${anomaly ? '<span class="gap-chip-anomaly-dot"></span>' : ''}
                        整季缺失
                    </button>
                    <button title="忽略整季缺失" class="w-7 h-7 border-l border-black/5 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/10 text-gray-400 hover:text-red-500 transition-colors" onclick='ignoreGapEpisode(${jsString(series.series_id)}, ${jsString(series.series_name)}, ${Number(ep.season || group.season || 0)}, 0)'>
                        <i class="fa-solid fa-xmark text-[11px]"></i>
                    </button>
                </div>
            `;
        }).join('');
    }
    const range = compactEpisodeRange(group.episodes);
    if (range) {
        const statusClass = range.isPending
            ? 'bg-amber-50 dark:bg-amber-500/10 border-amber-200 dark:border-amber-500/20 text-amber-700 dark:text-amber-300'
            : 'bg-cyan-50 dark:bg-cyan-500/10 border-cyan-200 dark:border-cyan-500/20 text-cyan-700 dark:text-cyan-300';
        return `
            <button title="搜索全部缺失" class="gap-episode-compact inline-flex items-center gap-2 rounded-lg border ${statusClass} px-3 text-[11px] font-black hover:bg-white/70 dark:hover:bg-white/10 transition-colors" onclick='openGapSourceAll(${jsString(series.series_id)})'>
                <i class="fa-solid fa-layer-group text-[10px] opacity-70"></i>
                <span>整集</span>
                <span class="opacity-70">${compactRangeLabel(range)}</span>
                <span class="opacity-60">${range.count}集</span>
            </button>
        `;
    }
    return group.episodes.map(ep => {
        const statusClass = Number(ep.status) === 2
            ? 'bg-amber-50 dark:bg-amber-500/10 border-amber-200 dark:border-amber-500/20 text-amber-700 dark:text-amber-300'
            : 'bg-gray-50 dark:bg-white/5 border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-300';
        return `
            <div class="gap-episode-chip inline-flex items-center rounded-lg border ${statusClass} overflow-hidden">
                <button title="搜索全部缺失" class="gap-chip px-2 text-[11px] font-black hover:text-brand-500 hover:bg-white/60 dark:hover:bg-white/10 transition-colors" onclick='openGapSourceAll(${jsString(series.series_id)})'>
                    E${String(ep.episode).padStart(2, '0')}
                </button>
                <button title="忽略" class="w-7 h-7 border-l border-black/5 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/10 text-gray-400 hover:text-red-500 transition-colors" onclick='ignoreGapEpisode(${jsString(series.series_id)}, ${jsString(series.series_name)}, ${Number(ep.season)}, ${Number(ep.episode)})'>
                    <i class="fa-solid fa-xmark text-[11px]"></i>
                </button>
            </div>
        `;
    }).join('');
}

function gapFileStatusHtml(item) {
    if (isSeasonMissingGap(item)) {

    `;

function filterGapFileEpisodes(episodes, filter) {
    if (filter === 'missing') return episodes.filter(item => item.missing);
    if (filter === 'present') return episodes.filter(item => !item.missing);
    if (filter === 'virtual') return episodes.filter(item => item.virtual);
    if (filter === 'season_missing') return episodes.filter(isSeasonMissingGap);
    return episodes;
}

function setGapFileFilter(filter) {
    const next = ['all', 'present', 'missing', 'virtual', 'season_missing'].includes(String(filter || '')) ? String(filter) : 'all';
    if (gapState.fileFilter === next) return;
    gapState.fileFilter = next;
    renderGapFiles();
    const body = document.getElementById('gapFilesBody');
    if (body) body.scrollTop = 0;
}

function gapFileMissingTargets() {
    const data = gapState.fileData || {};
    const grouped = new Map();
    const seasonOnly = new Set();
    (Array.isArray(data.episodes) ? data.episodes : []).forEach(item => {
        if (!item?.missing) return;
        const season = Number(item.season || 0);
        const episode = Number(item.episode || 0);
        if (isSeasonMissingGap(item)) {
            if (Number.isInteger(season) && season >= 0) seasonOnly.add(season);
            return;
        }
        if (!Number.isInteger(episode) || episode <= 0) return;
        if (!grouped.has(season)) grouped.set(season, new Set());
        grouped.get(season).add(episode);
    });
    const targets = Array.from(seasonOnly).sort((a, b) => a - b).map(season => ({
        season,
        episodes: [],
        season_missing: true,
    }));
    targets.push(...Array.from(grouped.entries()).sort((a, b) => a[0] - b[0]).map(([season, episodes]) => ({
        season,
        episodes: Array.from(episodes).sort((a, b) => a - b),
    })).filter(target => target.episodes.length));
    return targets;
}

function gapFileActionSeries() {

    const cached = findGapSeries(modalSeries.series_id) || {};

        ...modalSeries,
        series_id: modalSeries.series_id || cached.series_id || '',
        series_name: modalSeries.series_name || cached.series_name || '',
        tmdb_id: modalSeries.tmdb_id || cached.tmdb_id || 0,

}

function renderGapFiles(data = null) {
    if (data) gapState.fileData = data;
    data = gapState.fileData || {};
    const body = document.getElementById('gapFilesBody');
    const title = document.getElementById('gapFilesTitle');
    const sub = document.getElementById('gapFilesSub');
    const series = data.series || {};
    const episodes = Array.isArray(data.episodes) ? data.episodes : [];
    const summary = data.summary || {};
    const filter = gapState.fileFilter || 'all';
    const visibleEpisodes = filterGapFileEpisodes(episodes, filter);
    const filterName = {
        all: '全部',
        present: '已入库',
        missing: '缺失',
        virtual: '虚拟',
        season_missing: '整季',
    }[filter] || '全部';
    title.textContent = series.series_name || '集数文件';
    const seasonMissingCount = Number(summary.season_missing_count || 0);
    sub.textContent = `${summary.episode_count ?? episodes.length} 项 · 已入库 ${summary.present_count ?? 0} · 缺失 ${summary.missing_count ?? 0}${seasonMissingCount ? ` · 整季 ${seasonMissingCount}` : ''}${filter !== 'all' ? ` · 当前${filterName} ${visibleEpisodes.length}` : ''}`;
    if (!episodes.length) {
        body.innerHTML = '<div class="text-center py-16 text-gray-400 font-bold">没有读取到集数</div>';
        return;
    }

    const groups = new Map();
    visibleEpisodes.forEach(item => {
        const season = Number(item.season || 0);
        if (!groups.has(season)) groups.set(season, []);
        groups.get(season).push(item);
    });
    const summaryHtml = `
        <div class="gap-files-summary-row mb-3">
            <div class="gap-files-summary">
                ${gapFilesFilterButton('all', '总数', summary.episode_count ?? episodes.length, 'bg-gray-100 dark:bg-white/5 text-gray-600 dark:text-gray-300')}
                ${gapFilesFilterButton('present', '已入库', summary.present_count ?? 0, 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300')}
                ${gapFilesFilterButton('missing', '缺失', summary.missing_count ?? 0, 'bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300')}
                ${Number(summary.virtual_count || 0) ? gapFilesFilterButton('virtual', '虚拟', summary.virtual_count, 'bg-cyan-50 dark:bg-cyan-500/10 text-cyan-700 dark:text-cyan-300') : ''}
                ${seasonMissingCount ? gapFilesFilterButton('season_missing', '整季', seasonMissingCount, 'bg-orange-50 dark:bg-orange-500/10 text-orange-700 dark:text-orange-300') : ''}
                ${Number(summary.source_count || 0) ? `<span class="bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-300">文件源 ${summary.source_count}</span>` : ''}
            </div>
            ${gapFileActionsHtml()}
        </div>
    `;
    if (!visibleEpisodes.length) {
        body.innerHTML = `${summaryHtml}<div class="text-center py-16 text-gray-400 font-bold">没有${escapeHtml(filterName)}集数</div>`;
        return;
    }
    const seasonsHtml = Array.from(groups.entries()).sort((a, b) => a[0] - b[0]).map(([season, items]) => {
        const missing = items.filter(item => item.missing).length;
        const seasonMissing = items.some(isSeasonMissingGap);
        items.sort((a, b) => Number(a.episode || 0) - Number(b.episode || 0));
        return `
            <section class="gap-files-season">
                <div class="gap-files-season-head">
                    <div class="text-sm font-black text-gray-900 dark:text-white">S${String(season).padStart(2, '0')}</div>
                    <div class="text-[11px] font-black text-gray-500 dark:text-gray-400">${seasonMissing ? '整季缺失' : `${items.length} 集${missing ? ` · 缺 ${missing}` : ''}`}</div>
                </div>
                <div>${items.map(renderGapFileRow).join('')}</div>
            </section>
        `;
    }).join('');
    body.innerHTML = `${summaryHtml}<div class="gap-files-list">${seasonsHtml}</div>`;
}

async function subscribeGapFileMissing() {
    const targets = gapFileMissingTargets();
    const series = gapFileActionSeries();
    const id = String(series.series_id || series.series_name || '').trim();
    if (!targets.length) {
        showToast('warning', '没有缺失集数');
        return;
    }
    if (!Number(series.tmdb_id || 0)) {
        showToast('error', '订阅失败', '缺少 TMDB ID，MoviePilot 无法准确订阅');
        return;
    }
    if (!id || gapState.subscribingSeries.has(id)) return;
    const first = targets[0];
    gapState.subscribingSeries.add(id);
    renderGapFiles();
    renderGapResults();
    try {
        const data = await gapApi('/api/gaps/subscribe_mp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                series_id: series.series_id || '',
                series_name: series.series_name || '',
                year: series.year || '',
                season: Number(first.season || 0),
                episodes: [...first.episodes],
                targets,
                tmdb_id: series.tmdb_id || 0,
            }),
        });
        showToast('success', '订阅已提交', data.message || '已添加到 MoviePilot 订阅');
    } catch (e) {
        showToast('error', '订阅失败', e.message);
    } finally {
        gapState.subscribingSeries.delete(id);
        renderGapFiles();
        renderGapResults();
    }
}

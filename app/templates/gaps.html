{% extends "base.html" %}
{% block title %}缺集管理{% endblock %}
{% block head %}
<style>
    .gap-shell {
        max-width: 1680px;
    }
    .gap-poster {
        width: 68px;
        height: 102px;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        object-position: center;
        background: linear-gradient(135deg, #e5e7eb, #f8fafc);
    }
    html.dark .gap-poster {
        background: linear-gradient(135deg, #1f2937, #111827);
    }
    .gap-chip {
        min-width: 38px;
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .gap-modal-panel {
        max-height: min(86vh, 760px);
    }
    .gap-toolbar {
        position: sticky;
        top: 72px;
        z-index: 30;
    }
    .gap-stat-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .gap-results-grid {
        display: grid;
        grid-template-columns: repeat(var(--gap-column-count, 1), minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
    }
    .gap-library-results {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }
    .gap-library-section {
        min-width: 0;
        container-type: inline-size;
    }
    .gap-library-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 4px 8px;
    }
    .gap-library-switch {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 1px;
    }
    .gap-library-switch button {
        flex: 0 0 auto;
    }
    .gap-card {
        --gap-card-height: 216px;
        --gap-season-window-height: 54px;
        display: flex;
        flex-direction: column;
        height: var(--gap-card-height);
        overflow: hidden;
    }
    .gap-series-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        height: 100%;
    }
    .gap-series-info {
        flex-shrink: 0;
    }
    .gap-series-seasons {
        flex: 0 0 var(--gap-season-window-height);
        min-height: var(--gap-season-window-height);
        max-height: var(--gap-season-window-height);
        overflow-y: auto;
        padding-right: 2px;
    }
    .gap-series-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
    }
    .gap-series-meta span {
        min-width: 0;
        max-width: 100%;
    }
    .gap-missing-meta {
        min-height: 20px;
    }
    .gap-season-row {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr) 34px;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        overflow: hidden;
    }
    .gap-episode-grid {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 1px;
        scrollbar-width: thin;
    }
    .gap-episode-compact {
        min-height: 32px;
        max-width: 100%;
        flex: 0 0 auto;
    }
    .gap-episode-chip {
        flex: 0 0 auto;
    }
    @media (min-width: 1280px) {
        .gap-results-grid { --gap-column-count: 2; }
        .gap-card { --gap-card-height: 212px; --gap-season-window-height: 54px; }
    }
    @media (min-width: 1440px) {
        .gap-results-grid { --gap-column-count: 3; }
        .gap-card { --gap-card-height: 216px; --gap-season-window-height: 54px; }
    }
    @media (min-width: 1900px) {
        .gap-card { --gap-card-height: 220px; }
    }
    @container (min-width: 760px) {
        .gap-results-grid { --gap-column-count: 2; }
        .gap-card { --gap-card-height: 212px; --gap-season-window-height: 54px; }
    }
    @container (min-width: 1180px) {
        .gap-results-grid { --gap-column-count: 3; }
        .gap-card { --gap-card-height: 216px; --gap-season-window-height: 54px; }
    }
    @container (min-width: 1600px) {
        .gap-card { --gap-card-height: 220px; }
    }
    @media (max-width: 1023px) {
        .gap-card { --gap-card-height: 220px; --gap-season-window-height: 54px; }
    }
    @media (max-width: 640px) {
        .gap-shell { padding-left: 12px; padding-right: 12px; }
        .gap-stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gap-toolbar { top: 72px; }
        .gap-poster { width: 56px; height: 84px; }
        .gap-library-header { align-items: flex-start; flex-direction: column; }
        .gap-library-switch { margin-left: -2px; margin-right: -2px; padding-left: 2px; padding-right: 2px; }
    }
</style>
{% endblock %}
{% block content %}
<div class="gap-shell mx-auto w-full px-4 md:px-8 py-5 pb-24">
    <div class="apple-card p-4 mb-3">
        <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-cyan-50 dark:bg-cyan-500/15 border border-cyan-100 dark:border-cyan-500/20 flex items-center justify-center text-cyan-500 shrink-0">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-lg font-black text-gray-900 dark:text-white">缺集管理</h1>

        <div class="p-5 border-b border-gray-100 dark:border-white/5">

                    <p id="gapSourceTarget" class="text-xs text-gray-500 dark:text-gray-400 mt-1"></p>

            </div>
        </div>
        <div class="p-4 grid grid-cols-2 gap-3">
            <button onclick="runGapSearch('moviepilot')" class="p-4 rounded-2xl bg-brand-50 dark:bg-brand-500/10 border border-brand-100 dark:border-brand-500/20 text-left hover:ring-2 hover:ring-brand-500 transition-all">

                <div class="text-sm font-black text-gray-900 dark:text-white">MoviePilot</div>
                <div class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">种子下载</div>

            <button onclick="runGapSearch('hdhive')" class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-100 dark:border-emerald-500/20 text-left hover:ring-2 hover:ring-emerald-500 transition-all">
                <i class="fa-solid fa-cloud-arrow-down text-emerald-500 text-xl mb-3"></i>
                <div class="text-sm font-black text-gray-900 dark:text-white">影巢</div>

<div id="gapResolverModal" class="fixed inset-0 z-[121] hidden opacity-0 transition-opacity duration-200">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeGapResolver()"></div>
    <div class="gap-modal-panel absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[94%] max-w-4xl bg-white dark:bg-apple-cardDark rounded-[24px] shadow-2xl border border-gray-200 dark:border-white/5 overflow-hidden flex flex-col">
        <div class="px-5 py-4 border-b border-gray-100 dark:border-white/5 flex items-center justify-between gap-3 shrink-0">
            <div class="min-w-0">
                <h3 id="gapResolverTitle" class="font-black text-gray-900 dark:text-white truncate">搜索结果</h3>

        </div>
        <div id="gapResolverBody" class="p-4 overflow-y-auto mac-scrollbar flex-1 min-h-[240px]"></div>

</div>

<div id="gapIgnoresModal" class="fixed inset-0 z-[122] hidden opacity-0 transition-opacity duration-200">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeGapIgnores()"></div>
    <div class="gap-modal-panel absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[94%] max-w-2xl bg-white dark:bg-apple-cardDark rounded-[24px] shadow-2xl border border-gray-200 dark:border-white/5 overflow-hidden flex flex-col">
        <div class="px-5 py-4 border-b border-gray-100 dark:border-white/5 flex items-center justify-between">
            <h3 class="font-black text-gray-900 dark:text-white">忽略列表</h3>
            <button onclick="closeGapIgnores()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-white/5 text-gray-400 hover:text-gray-700 dark:hover:text-white transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>

<div id="gapConfigModal" class="fixed inset-0 z-[123] hidden opacity-0 transition-opacity duration-200">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeGapConfig()"></div>
    <div class="gap-modal-panel absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[94%] max-w-2xl bg-white dark:bg-apple-cardDark rounded-[24px] shadow-2xl border border-gray-200 dark:border-white/5 overflow-hidden flex flex-col">
        <div class="px-5 py-4 border-b border-gray-100 dark:border-white/5 flex items-center justify-between">
            <h3 class="font-black text-gray-900 dark:text-white">缺集设置</h3>
            <button onclick="closeGapConfig()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-white/5 text-gray-400 hover:text-gray-700 dark:hover:text-white transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>

                    <input id="gapCacheHours" type="number" min="1" step="1" class="w-full px-3 py-2 pr-10 rounded-xl bg-gray-50 dark:bg-apple-hoverDark border border-gray-200 dark:border-white/10 text-sm font-bold outline-none focus:ring-2 focus:ring-brand-500" value="6">
                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 font-bold">小时</span>
                </div>
            </div>

                <label class="block text-xs font-black text-gray-500 dark:text-gray-400 mb-2">排除剧集库</label>

<script>
const gapState = {
    items: [],
    summary: {},
    activeLibrary: '',
    pending: null,
    source: '',
    resolverResults: [],
    pollTimer: null,
    refreshingSeries: new Set(),
};
const GAP_EMBY_EXTERNAL_BASE = 'https://emby.ikirito.de';
let gapEmbyServerId = '';

document.addEventListener('DOMContentLoaded', () => {
    loadGapStatus();
    loadGapEmbyConfig().then(() => {
        if (gapState.items.length) renderGapResults();
    });
});

async function gapApi(url, options = {}) {
    const res = await fetch(url, options);
    const data = await res.json();
    if (data.status === 'error') throw new Error(data.message || '请求失败');
    return data;
}

function showGapModal(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('hidden');
    void el.offsetWidth;
    el.classList.remove('opacity-0');
}

function hideGapModal(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('opacity-0');
    setTimeout(() => el.classList.add('hidden'), 180);
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function jsString(value) {
    return JSON.stringify(String(value ?? '')).replace(/</g, '\\u003c');
}

async function loadGapEmbyConfig() {
    try {
        const data = await gapApi(`/api/config?_t=${Date.now()}`);
        gapEmbyServerId = data.data?.emby_server_id || '';
    } catch (e) {
        gapEmbyServerId = '';
    }
}

function embySeriesUrl(seriesId) {
    const id = String(seriesId || '').trim();
    if (!id) return '';
    const query = new URLSearchParams({ id });
    if (gapEmbyServerId) query.set('serverId', gapEmbyServerId);
    return `${GAP_EMBY_EXTERNAL_BASE}/web/index.html#!/item?${query.toString()}`;
}

function formatBytes(value) {
    if (typeof value === 'string') {
        if (/[kmgt]b/i.test(value)) return value;
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) return value || '未知';
        value = parsed;
    }
    const num = Number(value || 0);
    if (!num) return '未知';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let size = num;
    let idx = 0;
    while (size >= 1024 && idx < units.length - 1) {
        size /= 1024;
        idx += 1;
    }
    return `${size.toFixed(idx >= 3 ? 2 : 1)} ${units[idx]}`;
}

function gapTransferStatus(item) {
    return String(item?.ui_transfer_status || item?.status || '').trim().toLowerCase();
}

function isGapTransferSuccess(status) {
    return ['transferred', 'already_owned', 'submitted', 'success', 'ok', 'unlocked'].includes(String(status || '').trim().toLowerCase());
}

function isGapTransferDone(item) {
    return ['transferred', 'already_owned', 'submitted', 'success', 'ok', 'unlocked'].includes(gapTransferStatus(item));
}

function isUnlockedResource(item) {
    const status = gapTransferStatus(item);
    return item?.is_unlocked === true
        || item?.ui_unlocked === true
        || status === 'transferred'
        || status === 'already_owned'
        || status === 'unlocked'
        || (item?.ui_transfer_marked === true && isGapTransferSuccess(status));
}

function unlockedResourceLabel(item) {
    const status = gapTransferStatus(item);
    if (status === 'already_owned') return '已在 115';
    if (isGapTransferDone(item)) return '已转存';
    return '已解锁';
}

function unlockedResourceBadgeClass(item) {
    const status = gapTransferStatus(item);
    if (status === 'already_owned') {
        return 'bg-sky-500 text-white shadow-sm shadow-sky-500/30 ring-1 ring-sky-300/50';
    }
    if (isGapTransferDone(item)) {
        return 'bg-emerald-500 text-white shadow-sm shadow-emerald-500/30 ring-1 ring-emerald-300/50';
    }
    return 'bg-amber-400 text-gray-950 shadow-sm shadow-amber-400/30 ring-1 ring-amber-200/60';
}

function gapResolverAction(item) {
    if (item?.ui_transfer_pending === true) {
        return {
            label: '正在转存',
            icon: 'fa-solid fa-circle-notch fa-spin',
            className: 'bg-sky-500 text-white shadow-sm shadow-sky-500/30 cursor-wait',
            disabled: true,
        };
    }
    const status = gapTransferStatus(item);
    if (status === 'already_owned') {
        return {
            label: '已在 115',
            icon: 'fa-solid fa-circle-check',
            className: 'bg-sky-500 text-white shadow-sm shadow-sky-500/30 cursor-default opacity-95',
            disabled: true,
        };
    }
    if (isGapTransferDone(item)) {
        return {
            label: '已转存',
            icon: 'fa-solid fa-circle-check',
            className: 'bg-emerald-600 text-white shadow-sm shadow-emerald-500/30 cursor-default opacity-95',
            disabled: true,
        };
    }
    if (isUnlockedResource(item)) {
        return {
            label: '转存',
            icon: 'fa-solid fa-cloud-arrow-up',
            className: 'bg-cyan-500 hover:bg-cyan-600 text-white shadow-sm shadow-cyan-500/25 active:scale-95',
            disabled: false,
        };
    }
    return {
        label: '解锁转存',
        icon: 'fa-solid fa-cloud-arrow-down',
        className: 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-sm shadow-emerald-500/25 active:scale-95',
        disabled: false,
    };
}

function episodeLabel(season, episode) {
    return `S${String(season).padStart(2, '0')}E${String(episode).padStart(2, '0')}`;
}

function groupGaps(series) {
    const grouped = {};
    (series.gaps || []).forEach(ep => {
        const season = Number(ep.season || 0);
        if (!grouped[season]) grouped[season] = [];
        grouped[season].push(ep);
    });
    return Object.keys(grouped).map(season => ({
        season: Number(season),
        episodes: grouped[season].sort((a, b) => Number(a.episode) - Number(b.episode)),
    })).sort((a, b) => a.season - b.season);
}

async function loadGapStatus() {
    try {
        const data = await gapApi('/api/gaps/scan/progress');
        applyGapStatus(data.data || {});
    } catch (e) {
        document.getElementById('gapLoading').classList.add('hidden');
        showToast('error', '加载失败', e.message);
    }
}

function applyGapStatus(status) {
    const running = !!status.is_scanning;
    gapState.items = Array.isArray(status.results) ? status.results : [];
    gapState.summary = status.summary || {};
    document.getElementById('gapLoading').classList.add('hidden');
    updateGapStats(status);
    updateGapProgress(status);
    renderGapLibrarySwitch();
    renderGapResults();
    if (running) startGapPolling();
}

function updateGapStats(status = {}) {
    const summary = gapState.summary || {};
    const seriesCount = summary.series_count ?? gapState.items.length;
    const gapCount = summary.gap_count ?? gapState.items.reduce((sum, item) => sum + (item.gaps || []).length, 0);
    document.getElementById('statSeries').textContent = seriesCount;
    document.getElementById('statGaps').textContent = gapCount;
    document.getElementById('statProcessed').textContent = summary.processed ?? status.processed ?? 0;
    document.getElementById('statState').textContent = status.is_scanning ? '扫描中' : (status.error ? '异常' : '空闲');
    document.getElementById('gapLibraryCount').textContent = `剧集库 ${summary.library_count ?? 0}`;
    document.getElementById('gapCacheTime').textContent = status.created_at ? `缓存 ${status.created_at}` : '等待扫描';
}

function updateGapProgress(status = {}) {
    const card = document.getElementById('gapProgressCard');
    const scanBtn = document.getElementById('gapScanBtn');
    const running = !!status.is_scanning;
    card.classList.toggle('hidden', !running && !status.error);
    scanBtn.disabled = running;
    scanBtn.classList.toggle('opacity-60', running);
    const progress = Math.max(0, Math.min(100, Number(status.progress || 0)));
    document.getElementById('gapProgressBar').style.width = `${progress}%`;
    document.getElementById('gapProgressPct').textContent = `${progress}%`;
    document.getElementById('gapProgressText').textContent = status.error || status.current_item || '扫描中...';
}

async function startGapScan() {
    try {
        await gapApi('/api/gaps/scan/start', { method: 'POST' });
        showToast('success', '已启动扫描');
        startGapPolling();
    } catch (e) {
        showToast('error', '启动失败', e.message);
    }
}

async function refreshGapSeries(seriesId) {
    const id = String(seriesId || '').trim();
    if (!id || gapState.refreshingSeries.has(id)) return;
    gapState.refreshingSeries.add(id);
    renderGapResults();
    try {
        const data = await gapApi('/api/gaps/refresh_series', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ series_id: id }),
        });
        const status = (data.data || {}).status;
        if (status) {
            applyGapStatus(status);
        } else {
            await loadGapStatus();
        }
        showToast('success', '刷新完成', data.message || '该剧缺集数据已更新');
    } catch (e) {
        showToast('error', '刷新失败', e.message);
    } finally {
        gapState.refreshingSeries.delete(id);
        renderGapResults();
    }
}

function startGapPolling() {
    if (gapState.pollTimer) clearInterval(gapState.pollTimer);
    gapState.pollTimer = setInterval(async () => {
        try {
            const data = await gapApi(`/api/gaps/scan/progress?_t=${Date.now()}`);
            applyGapStatus(data.data || {});
            if (!data.data?.is_scanning) {
                clearInterval(gapState.pollTimer);
                gapState.pollTimer = null;
            }
        } catch (e) {
            clearInterval(gapState.pollTimer);
            gapState.pollTimer = null;
            showToast('error', '轮询失败', e.message);
        }
    }, 1200);
}

function filteredGapItems() {
    const keyword = (document.getElementById('gapSearchInput')?.value || '').trim().toLowerCase();
    let items = [...gapState.items];
    if (gapState.activeLibrary) {
        items = items.filter(item => gapLibraryName(item) === gapState.activeLibrary);
    }
    if (keyword) {
        items = items.filter(item => [
            item.series_name, item.tmdb_id, item.imdb_id, item.library_name
        ].some(v => String(v || '').toLowerCase().includes(keyword)));
    }
    return items;
}

function sortGapItems(items, sort) {
    items = [...items];
    if (sort === 'name_asc') {
        items.sort((a, b) => String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN'));
    } else if (sort === 'library_asc') {
        items.sort((a, b) => (
            String(a.library_name || '').localeCompare(String(b.library_name || ''), 'zh-CN')
            || String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN')
        ));
    } else {
        items.sort((a, b) => (
            (b.gaps || []).length - (a.gaps || []).length
            || String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN')
        ));
    }
    return items;
}

function gapLibraryName(series) {
    return String(series.library_name || '').trim() || '未分类媒体库';
}

function gapLibraryStats() {
    const grouped = new Map();
    gapState.items.forEach(item => {
        const library = gapLibraryName(item);
        if (!grouped.has(library)) grouped.set(library, { library, seriesCount: 0, gapCount: 0 });
        const stat = grouped.get(library);
        stat.seriesCount += 1;
        stat.gapCount += (item.gaps || []).length;
    });
    return Array.from(grouped.values()).sort((a, b) => a.library.localeCompare(b.library, 'zh-CN'));
}

function renderGapLibrarySwitch() {
    const container = document.getElementById('gapLibrarySwitch');
    if (!container) return;
    const stats = gapLibraryStats();
    if (gapState.activeLibrary && !stats.some(item => item.library === gapState.activeLibrary)) {
        gapState.activeLibrary = '';
    }
    const total = {
        library: '',
        label: '全部',
        seriesCount: gapState.items.length,
        gapCount: gapState.items.reduce((sum, item) => sum + (item.gaps || []).length, 0),
    };
    const buttons = [total, ...stats.map(item => ({ ...item, label: item.library }))];
    container.innerHTML = buttons.map(item => {
        const active = item.library === gapState.activeLibrary;
        const activeClass = active
            ? 'bg-brand-500 border-brand-500 text-white shadow-sm'
            : 'bg-gray-50 dark:bg-apple-hoverDark border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-white/10 hover:text-brand-500';
        return `
            <button type="button" aria-pressed="${active ? 'true' : 'false'}" onclick='setGapLibraryFilter(${jsString(item.library)})' class="px-3 py-2 rounded-xl border ${activeClass} text-xs font-black transition-all active:scale-95">
                <span>${escapeHtml(item.label)}</span>
                <span class="${active ? 'text-white/75' : 'text-gray-400 dark:text-gray-500'} ml-1">${item.seriesCount}/${item.gapCount}</span>
            </button>
        `;
    }).join('');
}

function setGapLibraryFilter(library) {
    gapState.activeLibrary = String(library || '');
    renderGapLibrarySwitch();
    renderGapResults();
    document.getElementById('gapResults')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function groupItemsByLibrary(items) {
    const sort = document.getElementById('gapSortSelect')?.value || 'gap_desc';
    const grouped = new Map();
    items.forEach(item => {
        const library = gapLibraryName(item);
        if (!grouped.has(library)) grouped.set(library, []);
        grouped.get(library).push(item);
    });
    return Array.from(grouped.entries()).map(([library, series]) => ({
        library,
        series: sortGapItems(series, sort === 'library_asc' ? 'name_asc' : sort),
        gapCount: series.reduce((sum, item) => sum + (item.gaps || []).length, 0),
    })).sort((a, b) => a.library.localeCompare(b.library, 'zh-CN'));
}

function compactEpisodeRange(episodes) {
    if (!Array.isArray(episodes) || episodes.length < 6) return null;
    const numbers = episodes.map(ep => Number(ep.episode || 0));
    if (numbers.some(num => !Number.isInteger(num) || num <= 0)) return null;
    const unique = new Set(numbers);
    if (unique.size !== numbers.length) return null;
    const sorted = [...numbers].sort((a, b) => a - b);
    for (let i = 1; i < sorted.length; i += 1) {
        if (sorted[i] !== sorted[i - 1] + 1) return null;
    }
    return {
        start: sorted[0],
        end: sorted[sorted.length - 1],
        count: sorted.length,
        isPending: episodes.every(ep => Number(ep.status) === 2),
    };
}

function compactRangeLabel(range) {
    return `E${String(range.start).padStart(2, '0')}-E${String(range.end).padStart(2, '0')}`;
}

function renderGapEpisodeButtons(series, group, episodeCsv) {
    const range = compactEpisodeRange(group.episodes);
    if (range) {
        const statusClass = range.isPending
            ? 'bg-amber-50 dark:bg-amber-500/10 border-amber-200 dark:border-amber-500/20 text-amber-700 dark:text-amber-300'
            : 'bg-cyan-50 dark:bg-cyan-500/10 border-cyan-200 dark:border-cyan-500/20 text-cyan-700 dark:text-cyan-300';
        return `
            <button title="搜索 ${compactRangeLabel(range)}" class="gap-episode-compact inline-flex items-center gap-2 rounded-lg border ${statusClass} px-3 text-[11px] font-black hover:bg-white/70 dark:hover:bg-white/10 transition-colors" onclick='openGapSource(${jsString(series.series_id)}, ${Number(group.season)}, "${episodeCsv}")'>
                <i class="fa-solid fa-layer-group text-[10px] opacity-70"></i>
                <span>整集</span>
                <span class="opacity-70">${compactRangeLabel(range)}</span>
                <span class="opacity-60">${range.count}集</span>
            </button>
        `;
    }
    return group.episodes.map(ep => {
        const statusClass = Number(ep.status) === 2
            ? 'bg-amber-50 dark:bg-amber-500/10 border-amber-200 dark:border-amber-500/20 text-amber-700 dark:text-amber-300'
            : 'bg-gray-50 dark:bg-white/5 border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-300';
        return `
            <div class="gap-episode-chip inline-flex items-center rounded-lg border ${statusClass} overflow-hidden">
                <button class="gap-chip px-2 text-[11px] font-black hover:text-brand-500 hover:bg-white/60 dark:hover:bg-white/10 transition-colors" onclick='openGapSource(${jsString(series.series_id)}, ${Number(ep.season)}, "${Number(ep.episode)}")'>
                    E${String(ep.episode).padStart(2, '0')}
                </button>
                <button title="忽略" class="w-7 h-7 border-l border-black/5 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/10 text-gray-400 hover:text-red-500 transition-colors" onclick='ignoreGapEpisode(${jsString(series.series_id)}, ${jsString(series.series_name)}, ${Number(ep.season)}, ${Number(ep.episode)})'>
                    <i class="fa-solid fa-xmark text-[11px]"></i>
                </button>
            </div>
        `;
    }).join('');
}

function renderGapResults() {
    const container = document.getElementById('gapResults');
    const empty = document.getElementById('gapEmpty');
    const items = filteredGapItems();
    empty.classList.toggle('hidden', items.length > 0);
    if (!items.length) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = groupItemsByLibrary(items).map(group => `
        <section class="gap-library-section" data-library="${escapeHtml(group.library)}">
            <div class="gap-library-header">
                <div class="flex items-center gap-2 min-w-0">
                    <i class="fa-solid fa-folder text-cyan-500 text-sm shrink-0"></i>
                    <h2 class="text-sm font-black text-gray-900 dark:text-white truncate">${escapeHtml(group.library)}</h2>
                </div>
                <div class="flex items-center gap-2 shrink-0 text-[11px] font-black text-gray-500 dark:text-gray-400">
                    <span class="px-2 py-1 rounded-lg bg-gray-100 dark:bg-white/5">${group.series.length} 部</span>
                    <span class="px-2 py-1 rounded-lg bg-cyan-50 dark:bg-cyan-500/10 text-cyan-600 dark:text-cyan-300">${group.gapCount} 缺口</span>

            </div>
            <div class="gap-results-grid">${group.series.map(renderGapCard).join('')}</div>
        </section>
    `).join('');
}

function findGapSeries(seriesId) {
    return gapState.items.find(item => String(item.series_id) === String(seriesId));
}

function openGapSource(seriesId, season, episodeCsv) {
    const series = findGapSeries(seriesId);
    if (!series) return;
    const episodes = String(episodeCsv || '').split(',').map(v => Number(v)).filter(Boolean);
    gapState.pending = { series, season: Number(season), episodes };
    document.getElementById('gapSourceTarget').textContent = `${series.series_name} S${String(season).padStart(2, '0')} ${episodes.map(e => `E${String(e).padStart(2, '0')}`).join(', ')}`;
    showGapModal('gapSourceModal');
}

function closeGapSourceModal() {
    hideGapModal('gapSourceModal');
}

async function runGapSearch(source) {
    const pending = gapState.pending;
    if (!pending) return;
    gapState.source = source;
    hideGapModal('gapSourceModal');
    showGapModal('gapResolverModal');
    const sourceLabel = source === 'hdhive' ? '影巢' : 'MoviePilot';
    document.getElementById('gapResolverTitle').textContent = `${sourceLabel} 搜索结果`;
    document.getElementById('gapResolverSub').textContent = `${pending.series.series_name} S${String(pending.season).padStart(2, '0')}`;
    document.getElementById('gapResolverBody').innerHTML = `
        <div class="text-center py-20 text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-brand-500"></i>
            <p class="text-sm font-bold">搜索中...</p>
        </div>
    `;
    try {
        const path = source === 'hdhive' ? '/api/gaps/search_hdhive' : '/api/gaps/search_mp';
        const data = await gapApi(path, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                series_id: pending.series.series_id,
                series_name: pending.series.series_name,
                season: pending.season,
                episodes: pending.episodes,
                tmdb_id: pending.series.tmdb_id || 0,
                type: 'tv',
            }),
        });
        gapState.resolverResults = source === 'hdhive'
            ? ((data.data || {}).results || [])
            : ((data.data || {}).results || []);
        renderGapResolver();
    } catch (e) {
        document.getElementById('gapResolverBody').innerHTML = `<div class="text-center py-16 text-red-400 font-bold">${escapeHtml(e.message)}</div>`;
    }
}

function renderGapResolver() {
    const body = document.getElementById('gapResolverBody');
    const results = gapState.resolverResults || [];
    if (!results.length) {
        body.innerHTML = '<div class="text-center py-16 text-gray-400 font-bold">没有搜索结果</div>';
        return;
    }
    body.innerHTML = `<div class="space-y-2">${results.map((item, idx) => renderResolverItem(item, idx)).join('')}</div>`;
}

function joinList(value) {
    if (Array.isArray(value)) return value.filter(Boolean).join(' / ');
    return value ? String(value) : '';
}

function shortDateTime(value) {
    const text = String(value || '').trim();
    return text.length >= 16 ? text.slice(0, 16) : text;
}

function renderResolverItem(item, idx) {
    const isHdhive = gapState.source === 'hdhive';
    const title = item.title || item.name || '未知资源';
    const ratio = Number(item.ui_episode_match_ratio || 0);
    const matchClass = ratio > 0 ? 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-500/10' : 'text-gray-500 bg-gray-100 dark:bg-white/5';
    if (isHdhive) {
        const res = joinList(item.video_resolution);
        const src = joinList(item.source);
        const subtitle = [joinList(item.subtitle_language), joinList(item.subtitle_type)].filter(Boolean).join(' · ');
        const validate = [item.validate_message || '', shortDateTime(item.last_validated_at)].filter(Boolean).join(' · ');
        const officialBadge = (item.ui_is_official || item.is_official)
            ? '<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-400/15 dark:text-amber-300 border border-amber-200/70 dark:border-amber-300/20">官组</span>'
            : '';
        const unlocked = isUnlockedResource(item);
        const unlockBadge = unlocked
            ? `<span class="px-2.5 py-1 rounded-full ${unlockedResourceBadgeClass(item)}">${escapeHtml(unlockedResourceLabel(item))}</span>`
            : (item.unlock_points !== undefined ? `<span>点数 ${escapeHtml(item.unlock_points)}</span>` : '');
        const action = gapResolverAction(item);
        return `
            <div class="rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50/80 dark:bg-white/5 p-3">
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                    <div class="min-w-0 flex-1">
                        <div class="font-black text-sm text-gray-900 dark:text-white break-words">${escapeHtml(title)}</div>
                        <div class="flex flex-wrap gap-2 mt-2 text-[11px] font-bold text-gray-500 dark:text-gray-400">
                            ${item.share_size ? `<span>${escapeHtml(item.share_size)}</span>` : ''}
                            ${res ? `<span>${escapeHtml(res)}</span>` : ''}
                            ${src ? `<span>${escapeHtml(src)}</span>` : ''}
                            ${officialBadge}
                            <span class="${matchClass} px-2 py-0.5 rounded-full">匹配 ${escapeHtml(item.ui_episode_match_text || '0/0')}</span>
                            ${unlockBadge}
                        </div>
                        ${item.remark ? `<div class="mt-2 rounded-xl bg-white/70 dark:bg-black/15 border border-gray-200/70 dark:border-white/10 px-3 py-2 text-[12px] leading-relaxed font-semibold text-gray-700 dark:text-gray-200 break-words">${escapeHtml(item.remark)}</div>` : ''}
                        <div class="flex flex-wrap gap-1.5 mt-2 text-[10px] font-bold text-gray-500 dark:text-gray-400">
                            ${subtitle ? `<span class="px-2 py-0.5 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10">字幕 ${escapeHtml(subtitle)}</span>` : ''}
                            ${item.pan_type ? `<span class="px-2 py-0.5 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10">网盘 ${escapeHtml(item.pan_type)}</span>` : ''}
                            ${item.sharer ? `<span class="px-2 py-0.5 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10">分享 ${escapeHtml(item.sharer)}</span>` : ''}
                            ${validate ? `<span class="px-2 py-0.5 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10">${escapeHtml(validate)}</span>` : ''}
                            ${item.unlock_count !== undefined ? `<span class="px-2 py-0.5 rounded-full bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10">解锁 ${escapeHtml(item.unlock_count)}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="downloadResolverResult(${idx})" ${action.disabled ? 'disabled' : ''} aria-busy="${item?.ui_transfer_pending === true ? 'true' : 'false'}" class="px-3 py-2 rounded-xl text-xs font-black shrink-0 transition-colors ${action.className}">
                        <i class="${action.icon} mr-1"></i>${action.label}
                    </button>
                </div>
            </div>
        `;
    }
    return `
        <div class="rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50/80 dark:bg-white/5 p-3">
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                <div class="min-w-0">
                    <div class="font-black text-sm text-gray-900 dark:text-white break-words">${escapeHtml(title)}</div>
                    <div class="flex flex-wrap gap-2 mt-2 text-[11px] font-bold text-gray-500 dark:text-gray-400">
                        ${item.site_name ? `<span>${escapeHtml(item.site_name)}</span>` : ''}
                        <span>${formatBytes(item.size)}</span>
                        ${item.resolution ? `<span>${escapeHtml(item.resolution)}</span>` : ''}
                        ${item.video_encode ? `<span>${escapeHtml(item.video_encode)}</span>` : ''}
                        <span class="${matchClass} px-2 py-0.5 rounded-full">匹配 ${escapeHtml(item.ui_episode_match_text || '0/0')}</span>
                        ${item.seeders !== undefined ? `<span>${escapeHtml(item.seeders)} 做种</span>` : ''}
                    </div>
                </div>
                <button onclick="downloadResolverResult(${idx})" class="px-3 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-black shrink-0">
                    <i class="fa-solid fa-download mr-1"></i>下载
                </button>
            </div>
        </div>
    `;
}

async function downloadResolverResult(idx) {
    const result = gapState.resolverResults[idx];
    const pending = gapState.pending;
    if (!result || !pending) return;
    result.ui_transfer_pending = true;
    renderGapResolver();
    try {
        const path = gapState.source === 'hdhive' ? '/api/gaps/download_hdhive' : '/api/gaps/download';
        const data = await gapApi(path, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                result,
                tmdb_id: pending.series.tmdb_id || 0,
                slug: result.slug || '',
                torrent_url: result.enclosure || '',
                series_name: pending.series.series_name || '',
                season: pending.season,
                episodes: pending.episodes,
            }),
        });
        if (gapState.source === 'hdhive') {
            const status = gapTransferStatus(data.data || {});
            if (isGapTransferSuccess(status)) {
                result.is_unlocked = true;
                result.ui_unlocked = true;
                result.ui_transfer_marked = true;
                result.ui_transfer_status = status || 'transferred';
                result.status = status;
            }
        }
        result.ui_transfer_pending = false;
        renderGapResolver();
        showToast('success', gapState.source === 'hdhive' ? '转存已提交' : '下载已提交', data.message || '');
    } catch (e) {
        result.ui_transfer_pending = false;
        renderGapResolver();
        showToast('error', '提交失败', e.message);
    }
}

function closeGapResolver() {
    hideGapModal('gapResolverModal');
}

async function ignoreGapSeries(seriesId, seriesName) {
    const ok = await showConfirm({
        type: 'danger',
        title: '忽略剧集',
        message: `确定忽略《${seriesName}》的缺集提醒吗？`,
        confirmText: '忽略',
    });
    if (!ok) return;
    try {
        await gapApi('/api/gaps/ignore/series', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({series_id: seriesId, series_name: seriesName}),
        });
        gapState.items = gapState.items.filter(item => String(item.series_id) !== String(seriesId));
        renderGapResults();
        updateGapStats();
        showToast('success', '已忽略');
    } catch (e) {
        showToast('error', '忽略失败', e.message);
    }
}

async function ignoreGapEpisode(seriesId, seriesName, season, episode) {
    try {
        await gapApi('/api/gaps/ignore', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({series_id: seriesId, series_name: seriesName, season_number: season, episode_number: episode}),
        });
        gapState.items = gapState.items.map(series => {
            if (String(series.series_id) !== String(seriesId)) return series;
            series.gaps = (series.gaps || []).filter(ep => !(Number(ep.season) === Number(season) && Number(ep.episode) === Number(episode)));
            series.gap_count = series.gaps.length;
            return series;
        }).filter(series => (series.gaps || []).length > 0);
        renderGapResults();
        updateGapStats();
        showToast('success', `已忽略 ${episodeLabel(season, episode)}`);
    } catch (e) {
        showToast('error', '忽略失败', e.message);
    }
}

async function openGapIgnores() {
    showGapModal('gapIgnoresModal');
    const body = document.getElementById('gapIgnoresBody');
    body.innerHTML = '<div class="text-center py-12 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
    try {
        const data = await gapApi(`/api/gaps/ignores?_t=${Date.now()}`);
        const items = data.data || [];
        if (!items.length) {
            body.innerHTML = '<div class="text-center py-12 text-gray-400 font-bold">没有忽略项</div>';
            return;
        }
        body.innerHTML = `<div class="space-y-2">${items.map(item => `
            <div class="rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 p-3 flex items-center justify-between gap-3">
                <div class="min-w-0">
                    <div class="font-black text-sm text-gray-900 dark:text-white truncate">${escapeHtml(item.label || item.series_name || item.id)}</div>
                    <div class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">${escapeHtml(item.type === 'series' ? '剧集' : '单集')} · ${escapeHtml(item.ignored_at || '')}</div>
                </div>
                <button onclick='restoreGapIgnore(${jsString(item.id)}, ${jsString(item.type)})' class="px-3 py-2 rounded-xl bg-brand-500/10 hover:bg-brand-500/20 text-brand-500 text-xs font-black shrink-0">恢复</button>
            </div>
        `).join('')}</div>`;
    } catch (e) {
        body.innerHTML = `<div class="text-center py-12 text-red-400 font-bold">${escapeHtml(e.message)}</div>`;
    }
}

function closeGapIgnores() {
    hideGapModal('gapIgnoresModal');
}

async function restoreGapIgnore(id, type) {
    try {
        await gapApi('/api/gaps/unignore', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, type}),
        });
        await openGapIgnores();
        showToast('success', '已恢复');
    } catch (e) {
        showToast('error', '恢复失败', e.message);
    }
}

async function openGapConfig() {
    showGapModal('gapConfigModal');
    const box = document.getElementById('gapConfigLibraries');
    box.innerHTML = '<div class="text-center py-8 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
    try {
        const [cfg, libs] = await Promise.all([
            gapApi(`/api/gaps/config?_t=${Date.now()}`),
            gapApi(`/api/gaps/libraries?_t=${Date.now()}`),
        ]);
        document.getElementById('gapCacheHours').value = (cfg.data || {}).cache_interval_hours || 6;
        const excluded = new Set((cfg.data || {}).excluded_libraries || []);
        const libraries = libs.data || [];
        if (!libraries.length) {
            box.innerHTML = '<div class="text-sm text-gray-400 font-bold">没有剧集库</div>';
            return;
        }
        box.innerHTML = libraries.map(lib => `
            <label class="flex items-center gap-3 rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 px-3 py-3 cursor-pointer">
                <input type="checkbox" class="ep-checkbox" value="${escapeHtml(lib.id)}" ${excluded.has(String(lib.id)) || lib.excluded ? 'checked' : ''}>
                <span class="text-sm font-bold text-gray-800 dark:text-white">${escapeHtml(lib.name)}</span>
            </label>
        `).join('');
    } catch (e) {
        box.innerHTML = `<div class="text-center py-8 text-red-400 font-bold">${escapeHtml(e.message)}</div>`;
    }
}

function closeGapConfig() {
    hideGapModal('gapConfigModal');
}

async function saveGapConfig() {
    const excluded = [...document.querySelectorAll('#gapConfigLibraries input[type="checkbox"]:checked')].map(input => input.value);
    const hours = Number(document.getElementById('gapCacheHours').value || 6);
    try {
        await gapApi('/api/gaps/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({excluded_libraries: excluded, cache_interval_hours: hours}),
        });
        closeGapConfig();
        showToast('success', '配置已保存');
    } catch (e) {
        showToast('error', '保存失败', e.message);
    }
}
</script>
{% endblock %}

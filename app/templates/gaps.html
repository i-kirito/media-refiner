async function runGapSearch(source) {
    const pending = gapState.pending;
    if (!pending) return;
    const resolverToken = gapState.resolverToken + 1;
    gapState.resolverToken = resolverToken;
    gapState.resolverOpen = true;
    gapState.source = source;
    hideGapModal('gapSourceModal');
    showGapModal('gapResolverModal');
    const sourceLabel = source === 'hdhive' ? '影巢' : 'MoviePilot';
    document.getElementById('gapResolverTitle').textContent = `${sourceLabel} 搜索结果`;
    document.getElementById('gapResolverSub').textContent = `${pending.series.series_name} ${pending.fullSeries ? '全集重下' : (pending.targetLabel || gapTargetLabel(pending.targets || []))}`;
    document.getElementById('gapResolverBody').innerHTML = `
        <div class="text-center py-20 text-gray-400">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-brand-500"></i>
            <p class="text-sm font-bold">搜索中...</p>
        </div>
    `;
    try {
        const path = source === 'hdhive' ? '/api/gaps/search_hdhive' : '/api/gaps/search_mp';
        const data = await gapApi(path, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                series_id: pending.series.series_id,
                series_name: pending.series.series_name,
                year: pending.series.year || '',
                season: pending.season,
                episodes: pending.episodes,
                targets: pending.targets || [],
                tmdb_id: pending.series.tmdb_id || 0,
                imdb_id: pending.series.imdb_id || '',
                library_name: pending.series.library_name || '',
                type: 'tv',
                full_series: pending.fullSeries === true,
            }),
        });
        if (gapState.resolverToken !== resolverToken || !gapState.resolverOpen) return;
        gapState.resolverResults = source === 'hdhive'
            ? ((data.data || {}).results || [])
            : ((data.data || {}).results || []);
        renderGapResolver();
        if (source === 'moviepilot') {
            refreshMoviePilotDownloadStatuses();
        }
    } catch (e) {
        if (gapState.resolverToken !== resolverToken || !gapState.resolverOpen) return;
        document.getElementById('gapResolverBody').innerHTML = `<div class="text-center py-16 text-red-400 font-bold">${escapeHtml(e.message)}</div>`;
    }
}

async function refreshMoviePilotDownloadStatuses() {
    if (!gapState.resolverOpen || gapState.source !== 'moviepilot' || !Array.isArray(gapState.resolverResults) || !gapState.resolverResults.length) return;
    const token = Date.now();
    gapState.downloadStatusToken = token;
    try {
        const data = await gapApi('/api/gaps/download_status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({results: gapState.resolverResults}),
        });
        if (!gapState.resolverOpen || gapState.downloadStatusToken !== token || gapState.source !== 'moviepilot') return;
        const results = (data.data || {}).results || [];
        if (Array.isArray(results) && results.length) {
            gapState.resolverResults = results;
            renderGapResolver();
        }
    } catch (e) {
        console.warn('MoviePilot 下载状态读取失败', e);
    }
}

function renderGapResolver() {
    if (!gapState.resolverOpen) return;
    const body = document.getElementById('gapResolverBody');
    const results = gapState.resolverResults || [];
    if (!results.length) {
        body.innerHTML = '<div class="text-center py-16 text-gray-400 font-bold">没有搜索结果</div>';
        return;
    }
    body.innerHTML = `<div class="gap-resolver-list">${results.map((item, idx) => renderResolverItem(item, idx)).join('')}</div>`;
}

function joinList(value) {
    if (Array.isArray(value)) return value.filter(Boolean).join(' / ');
    return value ? String(value) : '';
}

function shortDateTime(value) {
    const text = String(value || '').trim();
    return text.length >= 16 ? text.slice(0, 16) : text;
}

function safeHttpUrl(value) {
    const text = String(value || '').trim();
    if (!/^https?:\/\//i.test(text)) return '';
    try {
        const url = new URL(text);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
    } catch (_) {
        return '';
    }
}

function gapResolverPreviewUrl(item) {
    for (const key of ['page_url', 'resource_url', 'url', 'detail_url', 'preview_url', 'slug']) {
        const url = safeHttpUrl(item?.[key]);
        if (url) return url;
    }
    return '';
}

function renderResolverTitle(title, item, previewLabel = '查看详情页') {
    const previewUrl = gapResolverPreviewUrl(item);
    if (!previewUrl) return `<div class="gap-resolver-title">${escapeHtml(title)}</div>`;
    return `
        <div class="gap-resolver-title">
            <a href="${escapeHtml(previewUrl)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(previewLabel)}" class="gap-resolver-title-link">
                <span>${escapeHtml(title)}</span><i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>
    `;
}

function seasonRangeText(seasons) {
    const nums = [...new Set((seasons || []).map(v => Number(v)).filter(v => Number.isFinite(v) && v >= 0))]
        .sort((a, b) => a - b);
    const parts = [];
    let start = null;
    let prev = null;
    nums.forEach(num => {
        if (start === null) {
            start = num;
            prev = num;
            return;
        }
        if (num === prev + 1) {
            prev = num;
            return;
        }
        parts.push(start === prev
            ? `S${String(start).padStart(2, '0')}`
            : `S${String(start).padStart(2, '0')}-S${String(prev).padStart(2, '0')}`);
        start = num;
        prev = num;
    });
    if (start !== null) {
        parts.push(start === prev
            ? `S${String(start).padStart(2, '0')}`
            : `S${String(start).padStart(2, '0')}-S${String(prev).padStart(2, '0')}`);
    }
    return parts.join(' / ');
}

function resolverTargetBadge(item) {
    const matchKind = String(item?.ui_episode_match_kind || '');
    if (matchKind === 'none') return '';

    const targets = Array.isArray(item?.ui_gap_targets)
        ? item.ui_gap_targets.filter(target => target && String(target.match_kind || '') !== 'none')
        : [];
    if (targets.length) {
        const seasonPackSeasons = [];
        const episodeParts = [];
        targets.forEach(target => {
            const targetKind = String(target.match_kind || '');
            const season = Number(target.season ?? target.ui_target_season ?? -1);
            if (!Number.isFinite(season) || season < 0) return;
            const episodes = Array.isArray(target.matched_episodes) && target.matched_episodes.length
                ? target.matched_episodes
                : (Array.isArray(target.episodes) ? target.episodes : []);
            if ((targetKind === 'season_pack' || target.season_missing === true) && !episodes.length) {
                seasonPackSeasons.push(season);
                return;
            }
            if (episodes.length) {
                const fileSeason = Number(target.file_season || season);
                const fileText = fileSeason && fileSeason !== season ? ` · 文件 S${String(fileSeason).padStart(2, '0')}` : '';
                episodeParts.push(`S${String(season).padStart(2, '0')} ${episodeListText(episodes)}${fileText}`);
            }
        });
        const parts = [];
        const seasonText = seasonRangeText(seasonPackSeasons);
        if (seasonText) parts.push(`${seasonText} 整季`);
        parts.push(...episodeParts);
        if (parts.length) {
            return `<span class="gap-resolver-pill gap-resolver-pill-match">${escapeHtml(`命中 ${parts.join(' / ')}`)}</span>`;
        }
    }

    if (matchKind === 'full_series' || item?.ui_full_series === true) {
        return '<span class="gap-resolver-pill gap-resolver-pill-match">命中全集</span>';
    }

    const season = Number(item?.ui_target_season || 0);
    const episodes = Array.isArray(item?.ui_target_episodes) ? item.ui_target_episodes : [];
    if (!episodes.length) {
        if (matchKind === 'season_pack' && season >= 0) {
            return `<span class="gap-resolver-pill gap-resolver-pill-match">命中 S${String(season).padStart(2, '0')} 整季</span>`;
        }
        return '';
    }
    const fileSeason = Number(item?.ui_file_season || season);
    const text = `命中 S${String(season).padStart(2, '0')} ${episodeListText(episodes)}`;
    const fileText = fileSeason && fileSeason !== season ? ` · 文件 S${String(fileSeason).padStart(2, '0')}` : '';
    return `<span class="gap-resolver-pill gap-resolver-pill-match">${escapeHtml(text + fileText)}</span>`;
}

function resolverMatchText(item) {
    const text = item?.ui_episode_match_text || '0/0';
    if (item?.ui_full_series === false && item?.ui_download_blocked === true) {
        return `类型 ${text}`;
    }
    return `匹配 ${text}`;
}

function renderResolverItem(item, idx) {
    const isHdhive = gapState.source === 'hdhive';
    const title = item.title || item.name || '未知资源';
    const ratio = Number(item.ui_episode_match_ratio || 0);
    const matchKind = String(item.ui_episode_match_kind || '');
    const matchClass = ['season_pack', 'episode_pack'].includes(matchKind)
        ? 'gap-resolver-pill-pack'
        : (ratio > 0 ? 'gap-resolver-pill-match' : 'gap-resolver-pill-muted');
    if (isHdhive) {
        const res = joinList(item.video_resolution);
        const src = joinList(item.source);
        const subtitle = [joinList(item.subtitle_language), joinList(item.subtitle_type)].filter(Boolean).join(' · ');
        const validate = [item.validate_message || '', shortDateTime(item.last_validated_at)].filter(Boolean).join(' · ');
        const officialBadge = (item.ui_is_official || item.is_official)
            ? '<span class="gap-resolver-pill gap-resolver-pill-official">官组</span>'
            : '';
        const unlocked = isUnlockedResource(item);
        const unlockBadge = unlocked
            ? `<span class="gap-resolver-status ${unlockedResourceBadgeClass(item)}">${escapeHtml(unlockedResourceLabel(item))}</span>`
            : (item.unlock_points !== undefined ? `<span class="gap-resolver-pill">点数 ${escapeHtml(item.unlock_points)}</span>` : '');
        const action = gapResolverAction(item);
        return `
            <div class="gap-resolver-card">
                <div class="gap-resolver-main">
                    <div class="min-w-0 flex-1">
                        ${renderResolverTitle(title, item, '查看解锁页面预览')}
                        <div class="gap-resolver-pills">
                            ${item.share_size ? `<span class="gap-resolver-pill">${escapeHtml(item.share_size)}</span>` : ''}
                            ${res ? `<span class="gap-resolver-pill">${escapeHtml(res)}</span>` : ''}
                            ${src ? `<span class="gap-resolver-pill">${escapeHtml(src)}</span>` : ''}
                            ${officialBadge}
                            <span class="gap-resolver-pill ${matchClass}">${escapeHtml(resolverMatchText(item))}</span>
                            ${resolverTargetBadge(item)}
                            ${unlockBadge}
                        </div>
                        ${item.remark ? `<div class="gap-resolver-remark mac-scrollbar">${escapeHtml(item.remark)}</div>` : ''}
                        <div class="gap-resolver-pills">
                            ${subtitle ? `<span class="gap-resolver-pill">字幕 ${escapeHtml(subtitle)}</span>` : ''}
                            ${item.pan_type ? `<span class="gap-resolver-pill">网盘 ${escapeHtml(item.pan_type)}</span>` : ''}
                            ${item.sharer ? `<span class="gap-resolver-pill">分享 ${escapeHtml(item.sharer)}</span>` : ''}
                            ${validate ? `<span class="gap-resolver-pill">${escapeHtml(validate)}</span>` : ''}
                            ${item.unlock_count !== undefined ? `<span class="gap-resolver-pill">解锁 ${escapeHtml(item.unlock_count)}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="downloadResolverResult(${idx})" ${action.disabled ? 'disabled' : ''} title="${escapeHtml(action.title || '')}" aria-busy="${item?.ui_transfer_pending === true ? 'true' : 'false'}" class="gap-resolver-action shrink-0 transition-colors ${action.className}">
                        <i class="${action.icon}"></i><span>${action.label}</span>
                    </button>
                </div>
            </div>
        `;
    }
    const action = moviepilotResolverAction(item);
    return `
        <div class="gap-resolver-card">
            <div class="gap-resolver-main">
                <div class="min-w-0">
                    ${renderResolverTitle(title, item, '查看种子详情页')}
                    <div class="gap-resolver-pills">
                        ${item.site_name ? `<span class="gap-resolver-pill">${escapeHtml(item.site_name)}</span>` : ''}
                        <span class="gap-resolver-pill">${formatBytes(item.size)}</span>
                        ${item.resolution ? `<span class="gap-resolver-pill">${escapeHtml(item.resolution)}</span>` : ''}
                        ${item.video_encode ? `<span class="gap-resolver-pill">${escapeHtml(item.video_encode)}</span>` : ''}
                        <span class="gap-resolver-pill ${matchClass}">${escapeHtml(resolverMatchText(item))}</span>
                        ${resolverTargetBadge(item)}
                        ${item.seeders !== undefined ? `<span class="gap-resolver-pill">${escapeHtml(item.seeders)} 做种</span>` : ''}
                        ${item.ui_download_blocked ? `<span class="gap-resolver-pill gap-resolver-pill-pack">${escapeHtml(item.ui_download_block_reason || '不会自动下载整包')}</span>` : ''}
                    </div>
                </div>
                <button onclick="downloadResolverResult(${idx})" ${action.disabled ? 'disabled' : ''} title="${escapeHtml(action.title)}" class="gap-resolver-action shrink-0 ${action.className}">
                    <i class="${action.icon}"></i><span>${action.label}</span>
                </button>
            </div>
        </div>
    `;
}

async function downloadResolverResult(idx) {
    const result = gapState.resolverResults[idx];
    const pending = gapState.pending;
    if (!result || !pending) return;
    const source = gapState.source;
    const matchKind = String(result.ui_episode_match_kind || '');
    const forceMismatch = result.ui_download_blocked === true || matchKind === 'none';
    if (pending.fullSeries && matchKind !== 'full_series' && result.ui_full_series !== true) {
        showToast('warning', '已拦截不匹配资源', result.ui_download_block_reason || '该资源不是全集/整季包');
        return;
    }
    if (source === 'moviepilot' && result.ui_download_task === true) {
        showToast('warning', result.ui_download_label || '下载任务已存在', result.ui_downloader ? `下载器: ${result.ui_downloader}` : '');
        return;
    }
    if (forceMismatch) {
        showToast('warning', '强制提交不匹配资源', result.ui_download_block_reason || '该资源没有命中当前缺失集数');
    }
    result.ui_transfer_pending = true;
    renderGapResolver();
    try {
        const path = source === 'hdhive' ? '/api/gaps/download_hdhive' : '/api/gaps/download';
        const forceTransfer = source === 'hdhive' && isGapTransferDone(result);
        const data = await gapApi(path, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                result,
                tmdb_id: pending.series.tmdb_id || 0,
                slug: result.slug || '',
                torrent_url: result.enclosure || '',
                series_id: pending.series.series_id || '',
                series_name: pending.series.series_name || '',
                season: pending.season,
                episodes: pending.episodes,
                targets: pending.targets || [],
                full_series: pending.fullSeries === true,
                force_transfer: forceTransfer,
                force_mismatch: forceMismatch,
            }),
        });
        if (source === 'hdhive') {
            const status = gapTransferStatus(data.data || {});
            if (isGapTransferSuccess(status)) {
                result.is_unlocked = true;
                result.ui_unlocked = true;
                result.ui_transfer_marked = true;
                result.ui_transfer_status = status || 'transferred';
                result.status = status;
            }
        }
        result.ui_transfer_pending = false;
        renderGapResolver();
        showToast('success', source === 'hdhive' ? '转存已提交' : '下载已提交', data.message || '');
        if (source === 'moviepilot') {
            setTimeout(refreshMoviePilotDownloadStatuses, 1500);
        }
    } catch (e) {
        result.ui_transfer_pending = false;
        renderGapResolver();
        showToast('error', '提交失败', e.message);
    }
}

function resetGapResolverContent({resetChrome = false} = {}) {
    const body = document.getElementById('gapResolverBody');
    if (body) body.innerHTML = '';
    if (!resetChrome) return;
    const title = document.getElementById('gapResolverTitle');
    const sub = document.getElementById('gapResolverSub');
    if (title) title.textContent = '搜索结果';
    if (sub) sub.textContent = '';
}

function closeGapResolver() {
    const closeToken = gapState.resolverToken + 1;
    gapState.resolverToken = closeToken;
    gapState.resolverOpen = false;
    gapState.downloadStatusToken = 0;
    requestAnimationFrame(() => {
        if (gapState.resolverToken !== closeToken || gapState.resolverOpen) return;
        resetGapResolverContent();
    });
    hideGapModal('gapResolverModal', () => {
        if (gapState.resolverToken !== closeToken || gapState.resolverOpen) return;
        gapState.source = '';
        gapState.resolverResults = [];
        resetGapResolverContent({resetChrome: true});
    });
}

async function ignoreGapSeries(seriesId, seriesName) {
    const ok = await showConfirm({
        type: 'danger',
        title: '忽略剧集',
        message: `确定忽略《${seriesName}》的缺集提醒吗？`,
        confirmText: '忽略',
    });
    if (!ok) return;
    try {
        await gapApi('/api/gaps/ignore/series', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({series_id: seriesId, series_name: seriesName}),
        });
        gapState.items = gapState.items.filter(item => String(item.series_id) !== String(seriesId));
        renderGapResults();
        updateGapStats();
        showToast('success', '已忽略');
    } catch (e) {
        showToast('error', '忽略失败', e.message);
    }
}

async function ignoreGapEpisode(seriesId, seriesName, season, episode) {
    try {
        await gapApi('/api/gaps/ignore', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({series_id: seriesId, series_name: seriesName, season_number: season, episode_number: episode}),
        });
        gapState.items = gapState.items.map(series => {
            if (String(series.series_id) !== String(seriesId)) return series;
            series.gaps = (series.gaps || []).filter(ep => !(Number(ep.season) === Number(season) && Number(ep.episode) === Number(episode)));
            series.gap_count = series.gaps.length;
            return series;
        }).filter(series => (series.gaps || []).length > 0);
        renderGapResults();
        updateGapStats();
        showToast('success', `已忽略 ${Number(episode || 0) <= 0 ? `S${String(season).padStart(2, '0')} 整季` : episodeLabel(season, episode)}`);
    } catch (e) {
        showToast('error', '忽略失败', e.message);
    }
}

async function openGapIgnores() {
    showGapModal('gapIgnoresModal');
    const body = document.getElementById('gapIgnoresBody');
    body.innerHTML = '<div class="text-center py-12 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
    try {
        const data = await gapApi(`/api/gaps/ignores?_t=${Date.now()}`);
        const items = data.data || [];
        if (!items.length) {
            body.innerHTML = '<div class="text-center py-12 text-gray-400 font-bold">没有忽略项</div>';
            return;
        }
        body.innerHTML = `<div class="space-y-2">${items.map(item => `
            <div class="rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 p-3 flex items-center justify-between gap-3">
                <div class="min-w-0">
                    <div class="font-black text-sm text-gray-900 dark:text-white truncate">${escapeHtml(item.label || item.series_name || item.id)}</div>
                    <div class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">${escapeHtml(item.type === 'series' ? '剧集' : '单集')} · ${escapeHtml(item.ignored_at || '')}</div>
                </div>
                <button onclick='restoreGapIgnore(${jsString(item.id)}, ${jsString(item.type)})' class="px-3 py-2 rounded-xl bg-brand-500/10 hover:bg-brand-500/20 text-brand-500 text-xs font-black shrink-0">恢复</button>
            </div>
        `).join('')}</div>`;
    } catch (e) {
        body.innerHTML = `<div class="text-center py-12 text-red-400 font-bold">${escapeHtml(e.message)}</div>`;
    }
}

function closeGapIgnores() {
    hideGapModal('gapIgnoresModal');
}

async function restoreGapIgnore(id, type) {
    try {
        await gapApi('/api/gaps/unignore', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id, type}),
        });
        await openGapIgnores();
        showToast('success', '已恢复');
    } catch (e) {
        showToast('error', '恢复失败', e.message);
    }
}

async function openGapConfig() {
    showGapModal('gapConfigModal');
    const box = document.getElementById('gapConfigLibraries');
    box.innerHTML = '<div class="text-center py-8 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
    try {
        const [cfg, libs] = await Promise.all([
            gapApi(`/api/gaps/config?_t=${Date.now()}`),
            gapApi(`/api/gaps/libraries?_t=${Date.now()}`),
        ]);
        document.getElementById('gapCacheHours').value = (cfg.data || {}).cache_interval_hours || 6;
        const excluded = new Set((cfg.data || {}).excluded_libraries || []);
        const libraries = libs.data || [];
        if (!libraries.length) {
            box.innerHTML = '<div class="text-sm text-gray-400 font-bold">没有剧集库</div>';
            return;
        }
        box.innerHTML = libraries.map(lib => `
            <label class="flex items-center gap-3 rounded-2xl border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 px-3 py-3 cursor-pointer">
                <input type="checkbox" class="ep-checkbox" value="${escapeHtml(lib.id)}" ${excluded.has(String(lib.id)) || lib.excluded ? 'checked' : ''}>
                <span class="text-sm font-bold text-gray-800 dark:text-white">${escapeHtml(lib.name)}</span>
            </label>
        `).join('');
    } catch (e) {
        box.innerHTML = `<div class="text-center py-8 text-red-400 font-bold">${escapeHtml(e.message)}</div>`;
    }
}

function closeGapConfig() {
    hideGapModal('gapConfigModal');
}

async function saveGapConfig() {
    const excluded = [...document.querySelectorAll('#gapConfigLibraries input[type="checkbox"]:checked')].map(input => input.value);
    const hours = Number(document.getElementById('gapCacheHours').value || 6);
    try {
        await gapApi('/api/gaps/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({excluded_libraries: excluded, cache_interval_hours: hours}),
        });
        closeGapConfig();
        showToast('success', '配置已保存');
    } catch (e) {
        showToast('error', '保存失败', e.message);
    }
}
</script>

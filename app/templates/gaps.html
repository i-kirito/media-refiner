{% extends "base.html" %}
{% block title %}缺集管理{% endblock %}
{% block head %}
<style>
    .gap-shell {
        max-width: 1680px;
    }
    .gap-poster {
        width: 68px;
        height: 102px;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        object-position: center;
        background: linear-gradient(135deg, #e5e7eb, #f8fafc);
    }
    html.dark .gap-poster {
        background: linear-gradient(135deg, #1f2937, #111827);
    }
    .gap-chip {
        min-width: 38px;
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .gap-modal-panel {
        max-height: min(86dvh, 47.5rem);
    }
    #gapResolverModal {
        will-change: opacity;
    }
    #gapResolverModal .gap-modal-panel,
    #gapResolverBody {
        contain: layout paint;
    }
    .gap-files-panel {
        width: min(97dvw, 92rem);
        max-width: calc(100dvw - 1.25rem);
    }
    .gap-files-body {
        background: #f8fafc;
    }
    html.dark .gap-files-body {
        background: rgba(0, 0, 0, 0.12);
    }
    .gap-resolver-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .gap-resolver-card {
        border: 1px solid #e5e7eb;
        background: #fff;
        border-radius: 16px;
        padding: 12px;
    }
    html.dark .gap-resolver-card {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
    }
    .gap-resolver-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
    }
    .gap-resolver-title {
        color: #111827;
        font-size: 14px;
        font-weight: 900;
        line-height: 1.45;
        overflow-wrap: anywhere;
    }
    html.dark .gap-resolver-title {
        color: #fff;
    }
    .gap-resolver-title-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        color: inherit;
        text-align: left;
        text-decoration: none;
        transition: color 160ms ease;
    }
    .gap-resolver-title-link:hover {
        color: #007AFF;
    }
    .gap-resolver-title-link i {
        color: #9ca3af;
        font-size: 10px;
        transform: translateY(1px);
    }
    html.dark .gap-resolver-title-link i {
        color: #6b7280;
    }
    .gap-resolver-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        min-width: 0;
    }
    .gap-resolver-pill,
    .gap-resolver-status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 100%;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        line-height: 1.2;
        white-space: nowrap;
    }
    .gap-resolver-pill {
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #4b5563;
    }
    html.dark .gap-resolver-pill {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #d1d5db;
    }
    .gap-resolver-pill-match {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #15803d;
    }
    html.dark .gap-resolver-pill-match {
        border-color: rgba(74, 222, 128, 0.22);
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
    }
    .gap-resolver-pill-pack {
        border-color: #fde68a;
        background: #fffbeb;
        color: #b45309;
    }
    html.dark .gap-resolver-pill-pack {
        border-color: rgba(251, 191, 36, 0.24);
        background: rgba(251, 191, 36, 0.12);
        color: #fcd34d;
    }
    .gap-resolver-pill-muted {
        color: #6b7280;
    }
    html.dark .gap-resolver-pill-muted {
        color: #9ca3af;
    }
    .gap-resolver-pill-official {
        border-color: #fde68a;
        background: #fffbeb;
        color: #b45309;
    }
    html.dark .gap-resolver-pill-official {
        border-color: rgba(251, 191, 36, 0.24);
        background: rgba(251, 191, 36, 0.12);
        color: #fcd34d;
    }
    .gap-resolver-pill-ed2k {
        border-color: #fb923c;
        background: #f97316;
        color: #fff;
        box-shadow: 0 4px 12px -6px rgba(234, 88, 12, 0.9);
        letter-spacing: 0.03em;
    }
    html.dark .gap-resolver-pill-ed2k {
        border-color: #fdba74;
        background: #ea580c;
        color: #fff7ed;
    }
    .gap-resolver-remark {
        max-height: 64px;
        margin-top: 10px;
        overflow-y: auto;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #f9fafb;
        padding: 8px 10px;
        color: #374151;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.55;
        overflow-wrap: anywhere;
    }
    html.dark .gap-resolver-remark {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.18);
        color: #e5e7eb;
    }
    .gap-resolver-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 104px;
        min-height: 36px;
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
    }
    .gap-files-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .gap-files-summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .gap-files-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        margin-left: auto;
    }
    .gap-files-summary button,
    .gap-files-summary span,
    .gap-file-status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 900;
        line-height: 1.2;
        white-space: nowrap;
    }
    .gap-files-summary button {
        transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
    }
    .gap-files-summary button:active {
        transform: scale(0.97);
    }
    .gap-files-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 30px;
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
        transition: transform 140ms ease, background-color 140ms ease, color 140ms ease;
    }
    .gap-files-action:active {
        transform: scale(0.97);
    }
    .gap-files-action:disabled {
        cursor: not-allowed;
        opacity: 0.52;
        transform: none;
    }
    .gap-files-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .gap-files-season {
        overflow: hidden;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    html.dark .gap-files-season {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: none;
    }
    .gap-files-season-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 42px;
        padding: 9px 12px;
        border: 0;
        border-bottom: 1px solid #e5e7eb;
        background: #f9fafb;
        color: inherit;
        cursor: pointer;
        text-align: left;
        transition: background-color 140ms ease, border-color 140ms ease;
    }
    .gap-files-season-head:hover {
        background: #f1f5f9;
    }
    .gap-files-season-head:focus-visible {
        position: relative;
        z-index: 1;
        outline: 2px solid #3b82f6;
        outline-offset: -2px;
    }
    .gap-files-season.is-collapsed .gap-files-season-head {
        border-bottom-color: transparent;
    }
    .gap-files-season-meta {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex: 0 0 auto;
        min-width: 0;
    }
    .gap-files-season-chevron {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        color: #64748b;
        background: rgba(148, 163, 184, 0.12);
        transition: transform 160ms ease, background-color 140ms ease, color 140ms ease;
    }
    .gap-files-season-head[aria-expanded="true"] .gap-files-season-chevron {
        transform: rotate(180deg);
    }
    .gap-files-season-head:hover .gap-files-season-chevron {
        color: #2563eb;
        background: rgba(59, 130, 246, 0.12);
    }
    html.dark .gap-files-season-head {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
    }
    html.dark .gap-files-season-head:hover {
        background: rgba(255, 255, 255, 0.08);
    }
    html.dark .gap-files-season.is-collapsed .gap-files-season-head {
        border-bottom-color: transparent;
    }
    html.dark .gap-files-season-chevron {
        color: #cbd5e1;
        background: rgba(255, 255, 255, 0.08);
    }
    .gap-file-row {
        display: grid;
        grid-template-columns: max-content minmax(14rem, 0.78fr) minmax(26rem, 1.52fr);
        gap: clamp(0.75rem, 1dvw, 1rem);
        align-items: stretch;
        padding: 0.625rem clamp(0.75rem, 1dvw, 1rem);
        transition: background-color 140ms ease;
    }
    .gap-file-row:hover {
        background: #f8fafc;
    }
    html.dark .gap-file-row:hover {
        background: rgba(255, 255, 255, 0.035);
    }
    .gap-file-row + .gap-file-row {
        border-top: 1px solid #f3f4f6;
    }
    html.dark .gap-file-row + .gap-file-row {
        border-color: rgba(255, 255, 255, 0.08);
    }
    .gap-file-episode-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
    }
    .gap-file-title-col {
        min-width: 0;
        padding-top: 2px;
    }
    .gap-file-title-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        min-width: 0;
    }
    .gap-file-source-col {
        min-width: 0;
    }
    .gap-file-title,
    .gap-file-name,
    .gap-file-path {
        overflow-wrap: anywhere;
        word-break: break-word;
    }
    .gap-file-title {
        line-height: 1.35;
    }
    .gap-file-source {
        border-radius: 12px;
        border: 1px solid #dbe3ef;
        background: #f8fafc;
        padding: 9px 11px;
    }
    html.dark .gap-file-source {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.16);
    }
    .gap-file-source + .gap-file-source {
        margin-top: 6px;
    }
    .gap-file-name {
        color: #0f172a;
        font-size: 12px;
        font-weight: 900;
        line-height: 1.35;
    }
    html.dark .gap-file-name {
        color: #f8fafc;
    }
    .gap-file-path {
        margin-top: 4px;
        color: #64748b;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1.55;
    }
    html.dark .gap-file-path {
        color: #94a3b8;
    }
    .gap-file-meta {
        margin-top: 4px;
        color: #94a3b8;
        font-size: 10.5px;
        font-weight: 800;
    }
    .gap-toolbar {
        position: sticky;
        top: 72px;
        z-index: 30;
    }
    .gap-stat-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .gap-results-grid {
        display: grid;
        grid-template-columns: repeat(var(--gap-column-count, 1), minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
    }
    .gap-library-results {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }
    .gap-library-section {
        min-width: 0;
        container-type: inline-size;
    }
    .gap-library-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 4px 8px;
    }
    .gap-library-switch {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 1px;
    }
    .gap-library-switch button {
        flex: 0 0 auto;
    }
    .gap-card {
        --gap-card-height: 216px;
        --gap-season-window-height: 54px;
        display: flex;
        flex-direction: column;
        height: var(--gap-card-height);
        overflow: hidden;
    }
    .gap-series-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        height: 100%;
    }
    .gap-series-info {
        flex-shrink: 0;
        min-width: 0;
        overflow: hidden;
    }
    .gap-series-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
    }
    .gap-series-title {
        min-width: 0;
        flex: 1 1 auto;
        display: flex;
        align-items: flex-start;
        gap: 6px;
    }
    .gap-series-title-text {
        display: -webkit-box;
        max-width: 100%;
        overflow: hidden;
        overflow-wrap: anywhere;
        word-break: break-word;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        line-height: 1.25;
    }
    .gap-title-line {
        min-width: 0;
        flex: 1 1 auto;
    }
    .gap-anomaly-dot {
        width: 7px;
        height: 7px;
        margin-top: 4px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
        flex: 0 0 auto;
    }
    .gap-chip-anomaly-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.14);
        flex: 0 0 auto;
    }
    .gap-series-actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
    }
    .gap-series-seasons {
        flex: 0 0 var(--gap-season-window-height);
        min-height: var(--gap-season-window-height);
        max-height: var(--gap-season-window-height);
        overflow-y: auto;
        padding-right: 2px;
    }
    .gap-series-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
    }
    .gap-series-meta span {
        min-width: 0;
        max-width: 100%;
    }
    .gap-series-meta a {
        display: inline-flex;
        align-items: center;
        color: inherit;
        text-decoration: none;
        transition: color 140ms ease;
    }
    .gap-series-meta a:hover {
        color: #007AFF;
    }
    .gap-missing-meta {
        min-height: 20px;
    }
    .gap-season-row {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 44px;
        overflow: hidden;
    }
    .gap-episode-grid {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 8px 1px 0;
        scroll-padding-inline: 8px;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
    }
    .gap-episode-compact {
        min-height: 32px;
        max-width: 100%;
        flex: 0 0 auto;
    }
    .gap-episode-chip {
        flex: 0 0 auto;
    }
    @media (min-width: 1280px) {
        .gap-results-grid { --gap-column-count: 2; }
        .gap-card { --gap-card-height: 212px; --gap-season-window-height: 54px; }
    }
    @media (min-width: 1440px) {
        .gap-results-grid { --gap-column-count: 3; }
        .gap-card { --gap-card-height: 216px; --gap-season-window-height: 54px; }
    }
    @media (min-width: 1900px) {
        .gap-card { --gap-card-height: 220px; }
    }
    @container (min-width: 760px) {
        .gap-results-grid { --gap-column-count: 2; }
        .gap-card { --gap-card-height: 212px; --gap-season-window-height: 54px; }
    }
    @container (min-width: 1180px) {
        .gap-results-grid { --gap-column-count: 3; }
        .gap-card { --gap-card-height: 216px; --gap-season-window-height: 54px; }
    }
    @container (min-width: 1600px) {
        .gap-card { --gap-card-height: 220px; }
    }
    @media (max-width: 1023px) {
        .gap-card { --gap-card-height: 220px; --gap-season-window-height: 54px; }
        .gap-file-row { grid-template-columns: max-content minmax(0, 1fr); }
        .gap-file-source-col { grid-column: 1 / -1; }
    }
    @media (max-width: 640px) {
        .gap-shell { padding-left: 12px; padding-right: 12px; }
        .gap-stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gap-toolbar { top: 72px; }
        .gap-poster { width: 56px; height: 84px; }
        .gap-library-header { align-items: flex-start; flex-direction: column; }
        .gap-library-switch { margin-left: -2px; margin-right: -2px; padding-left: 2px; padding-right: 2px; }
        .gap-resolver-main { grid-template-columns: minmax(0, 1fr); }
        .gap-resolver-action { width: 100%; }
        .gap-files-summary-row { align-items: stretch; flex-direction: column; }
        .gap-files-actions { justify-content: flex-start; margin-left: 0; }
        .gap-file-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
        .gap-file-source-col { grid-column: auto; }
    }
</style>
{% endblock %}
{% block content %}
<div class="gap-shell mx-auto w-full px-4 md:px-8 py-5 pb-24">
    <div class="apple-card p-4 mb-3">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-cyan-50 dark:bg-cyan-500/15 border border-cyan-100 dark:border-cyan-500/20 flex items-center justify-center text-cyan-500 shrink-0">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-lg font-black text-gray-900 dark:text-white">缺集管理</h1>
                    <div class="flex flex-wrap items-center gap-2 mt-1 text-[11px] text-gray-500 dark:text-gray-400 font-medium">
                        <span id="gapCacheTime">等待扫描</span>
                        <span class="w-1 h-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
                        <span id="gapLibraryCount">剧集库 0</span>
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap lg:flex-nowrap lg:justify-end items-center gap-2">
                <button onclick="openGapConfig()" class="px-3 py-2 rounded-xl bg-gray-100 dark:bg-apple-hoverDark hover:bg-gray-200 dark:hover:bg-[#3A3A3C] text-gray-600 dark:text-gray-300 text-xs font-bold transition-colors border border-gray-200 dark:border-white/5 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i><span>设置</span>
                </button>
                <button onclick="openGapIgnores()" class="px-3 py-2 rounded-xl bg-gray-100 dark:bg-apple-hoverDark hover:bg-gray-200 dark:hover:bg-[#3A3A3C] text-gray-600 dark:text-gray-300 text-xs font-bold transition-colors border border-gray-200 dark:border-white/5 flex items-center gap-2">
                    <i class="fa-solid fa-box-archive"></i><span>忽略列表</span>
                </button>
                <button id="gapAutoFillBtn" onclick="openGapAutoFillPanel()" title="查看影巢自动补季任务" aria-label="自动补季" aria-haspopup="dialog" class="px-3 py-2 rounded-xl bg-cyan-50 dark:bg-cyan-500/10 hover:bg-cyan-100 dark:hover:bg-cyan-500/20 text-cyan-700 dark:text-cyan-300 text-xs font-bold transition-all active:scale-95 border border-cyan-100 dark:border-cyan-500/20 flex items-center gap-2 disabled:opacity-60">
                    <i id="gapAutoFillIcon" class="fa-solid fa-clock"></i>
                    <span id="gapAutoFillLabel">自动补季</span>
                    <span id="gapAutoFillCount" class="hidden min-w-5 h-5 px-1 rounded-md bg-black/10 dark:bg-white/10 items-center justify-center text-[10px] font-black">0</span>
                </button>
                <button id="gapScanBtn" onclick="startGapScan()" class="px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold transition-all active:scale-95 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i><span>扫描缺集</span>
                </button>
            </div>
        </div>
        <div class="gap-stat-strip mt-4 rounded-2xl overflow-hidden border border-gray-100 dark:border-white/10 bg-gray-50/70 dark:bg-white/5 divide-x divide-y sm:divide-y-0 divide-gray-200/70 dark:divide-white/10">
            <div class="px-4 py-3">
                <div class="text-[10px] font-black text-gray-400 dark:text-gray-500 mb-0.5">缺集剧集</div>
                <div id="statSeries" class="text-xl font-black text-gray-900 dark:text-white leading-none">0</div>
            </div>

<script>
const gapState = {
    items: [],
    summary: {},
    activeLibrary: '',
    pending: null,
    source: '',
    resolverResults: [],
    resolverOpen: false,
    resolverToken: 0,
    pollTimer: null,
    refreshingSeries: new Set(),
    subscribingSeries: new Set(),
    subscriptionStatus: new Map(),
    subscriptionStatusSignature: '',
    subscriptionStatusCheckedAt: 0,
    subscriptionStatusToken: 0,
    autoFillJobs: new Map(),
    autoFillEnabled: false,
    autoFillGlobalBusy: false,
    autoFillState: {},
    autoFillPanelFilter: 'all',
    autoFillPanelQuery: '',
    autoFillPanelLoading: false,
    dismissedProgressError: '',
    fileData: null,
    fileFilter: 'all',
    fileCollapsedSeasons: new Set(),
    clouddriveUrl: '',
    scanMonitor: null,
    scanStatus: {},
    downloadStatusToken: 0,
};
let GAP_EMBY_EXTERNAL_BASE = 'http://192.168.31.213:8096';
let gapEmbyServerId = '';
const gapModalHideTimers = new Map();

document.addEventListener('DOMContentLoaded', () => {
    loadGapStatus();
    loadGapEmbyConfig().then(() => {
        if (gapState.items.length) renderGapResults();
    });
});

async function gapApi(url, options = {}) {
    const res = await fetch(url, options);
    let data = null;
    try {
        data = await res.json();
    } catch (e) {
        throw new Error(res.ok ? '响应解析失败' : `请求失败 (${res.status})`);
    }
    if (!res.ok && data?.status !== 'success') {
        throw new Error(data?.message || `请求失败 (${res.status})`);
    }
    if (data.status === 'error') throw new Error(data.message || '请求失败');
    return data;
}

async function gapApiWithTimeout(url, options = {}, timeoutMs = 45000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), Math.max(1000, Number(timeoutMs) || 45000));
    try {
        return await gapApi(url, { ...options, signal: controller.signal });
    } catch (e) {
        if (e?.name === 'AbortError') {
            throw new Error(`请求超时（${Math.round((Number(timeoutMs) || 45000) / 1000)}s），请稍后重试`);
        }
        throw e;
    } finally {
        clearTimeout(timer);
    }
}

async function loadSharedScanMonitor() {
    try {
        const data = await gapApi(`/api/scan/status?_t=${Date.now()}`);
        return data.data || null;
    } catch (_) {
        return null;
    }
}

function showGapModal(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const hideTimer = gapModalHideTimers.get(id);
    if (hideTimer) {
        clearTimeout(hideTimer);
        gapModalHideTimers.delete(id);
    }
    el.classList.remove('hidden');
    void el.offsetWidth;
    el.classList.remove('opacity-0');
}

function hideGapModal(id, afterHidden = null) {
    const el = document.getElementById(id);
    if (!el) return;
    const hideTimer = gapModalHideTimers.get(id);
    if (hideTimer) clearTimeout(hideTimer);
    el.classList.add('opacity-0');
    gapModalHideTimers.set(id, setTimeout(() => {
        el.classList.add('hidden');
        gapModalHideTimers.delete(id);
        if (typeof afterHidden === 'function') requestAnimationFrame(afterHidden);
    }, 180));
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function jsString(value) {
    return JSON.stringify(String(value ?? '')).replace(/</g, '\\u003c');
}

async function loadGapEmbyConfig() {
    try {
        const data = await gapApi(`/api/config?_t=${Date.now()}`);
        gapEmbyServerId = data.data?.emby_server_id || '';
        gapState.clouddriveUrl = data.data?.clouddrive_url || '';
        const host = String(data.data?.emby_host || '').trim().replace(/\/$/, '');
        // 缺集页外链优先走配置中的内网 Emby 地址
        if (host) GAP_EMBY_EXTERNAL_BASE = host;
    } catch (e) {
        gapEmbyServerId = '';
        gapState.clouddriveUrl = '';
    }
}

function embySeriesUrl(seriesId) {
    const id = String(seriesId || '').trim();
    if (!id) return '';
    const query = new URLSearchParams({ id });
    if (gapEmbyServerId) query.set('serverId', gapEmbyServerId);
    return `${GAP_EMBY_EXTERNAL_BASE}/web/index.html#!/item?${query.toString()}`;
}

function tmdbSeriesUrl(tmdbId) {
    const id = String(tmdbId || '').trim();
    if (!id) return '';
    return `https://www.themoviedb.org/tv/${encodeURIComponent(id)}`;
}

function formatBytes(value) {
    if (typeof value === 'string') {
        if (/[kmgt]b/i.test(value)) return value;
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) return value || '未知';
        value = parsed;
    }
    const num = Number(value || 0);
    if (!num) return '未知';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let size = num;
    let idx = 0;
    while (size >= 1024 && idx < units.length - 1) {
        size /= 1024;
        idx += 1;
    }
    return `${size.toFixed(idx >= 3 ? 2 : 1)} ${units[idx]}`;
}

function formatDownloaderSpeed(value) {
    const speed = Number(value || 0);
    if (!Number.isFinite(speed) || speed <= 0) return '';
    return `${formatBytes(speed)}/s`;
}

function gapTransferStatus(item) {
    return String(item?.ui_transfer_status || item?.status || '').trim().toLowerCase();
}

function isEd2kResource(item) {
    const panType = String(item?.pan_type || '').trim().toLowerCase();
    const resourceUrl = String(
        item?.resource_url || item?.page_url || item?.slug || ''
    ).toLowerCase();
    return panType === 'ed2k' || resourceUrl.includes('/resource/ed2k/');
}

function isGapTransferSuccess(status) {
    return ['transferred', 'already_owned', 'success', 'ok', 'unlocked'].includes(String(status || '').trim().toLowerCase());
}

function isGapTransferredStatus(status) {
    return ['transferred', 'success', 'ok'].includes(String(status || '').trim().toLowerCase());
}

function isGapTransferDone(item) {
    const status = gapTransferStatus(item);
    return item?.ui_transfer_marked === true
        && (status === 'already_owned' || isGapTransferredStatus(status));
}

function isUnlockedResource(item) {
    const status = gapTransferStatus(item);
    return item?.is_unlocked === true
        || item?.ui_unlocked === true
        || status === 'transferred'
        || status === 'already_owned'
        || status === 'unlocked'
        || (item?.ui_transfer_marked === true && isGapTransferSuccess(status));
}

function isUnlockedOnlyResource(item) {
    const status = gapTransferStatus(item);
    return isUnlockedResource(item)
        && status !== 'already_owned'
        && status !== 'submitted'
        && !isGapTransferredStatus(status);
}

function unlockedResourceLabel(item) {
    return isGapTransferDone(item) ? '已转存' : '已解锁';
}

function unlockedResourceBadgeClass(item) {
    if (isGapTransferDone(item)) {
        return 'bg-emerald-500 text-white shadow-sm shadow-emerald-500/25 ring-1 ring-emerald-300/50';
    }
    return 'bg-amber-400 text-gray-950 shadow-sm shadow-amber-400/30 ring-1 ring-amber-200/60';
}

function gapResolverAction(item) {
    const isEd2k = isEd2kResource(item);
    if (item?.ui_transfer_pending === true) {
        return {
            label: isEd2k ? '离线到目录' : '正在转存',
            icon: 'fa-solid fa-circle-notch fa-spin',
            className: isEd2k
                ? 'bg-orange-500 text-white shadow-sm shadow-orange-500/30 cursor-wait'
                : 'bg-sky-500 text-white shadow-sm shadow-sky-500/30 cursor-wait',
            disabled: true,
        };
    }
    if (isEd2k) {
        return {
            label: '离线到目录',
            icon: 'fa-solid fa-bolt',
            className: 'bg-orange-600 hover:bg-orange-700 text-white shadow-sm shadow-orange-500/30 active:scale-95',
            disabled: false,
            title: '将 ED2K 资源离线到已配置的默认目录',
        };
    }
    const status = gapTransferStatus(item);
    const matchKind = String(item?.ui_episode_match_kind || '');
    if (isGapTransferDone(item)) {
        return {
            label: '重新转存',
            icon: 'fa-solid fa-rotate',
            className: 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm shadow-blue-500/30 active:scale-95',
            disabled: false,
            title: status === 'already_owned' ? '资源已在 115，仍会重新提交转存' : '该资源已有转存记录，仍会强制重新提交转存',
        };
    }
    if (item?.ui_download_blocked === true || matchKind === 'none') {
        return {
            label: '不匹配',
            icon: 'fa-solid fa-ban',
            className: 'bg-gray-200 hover:bg-gray-300 text-gray-600 dark:bg-white/10 dark:hover:bg-white/15 dark:text-gray-300 shadow-sm shadow-gray-300/20 active:scale-95',
            disabled: false,
            title: item?.ui_download_block_reason || '不匹配，点击仍会强制提交',
        };
    }
    if (isUnlockedOnlyResource(item)) {
        return {
            label: '整包转存',
            icon: 'fa-solid fa-cloud-arrow-down',
            className: 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-sm shadow-emerald-500/25 active:scale-95',
            disabled: false,
            title: '资源已解锁，按影巢完整资源转存到 115',
        };
    }
    return {
        label: '解锁转存',
        icon: 'fa-solid fa-cloud-arrow-down',
        className: 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-sm shadow-emerald-500/25 active:scale-95',
        disabled: false,
        title: '解锁后按影巢完整资源转存到 115',
    };
}

function moviepilotDownloadTaskAction(item) {
    const status = String(item?.ui_download_status || '').trim().toLowerCase();
    const baseLabel = item?.ui_download_label || '已在下载器';
    const progress = Number(item?.ui_download_progress || 0);
    const speed = formatDownloaderSpeed(item?.ui_download_speed);
    const showProgress = ['downloading', 'stalled', 'queued', 'checking'].includes(status) && progress > 0 && progress < 1;
    const label = showProgress ? `${baseLabel} ${Math.round(progress * 100)}%` : baseLabel;
    const titleParts = [
        item?.ui_downloader ? `下载器: ${item.ui_downloader}` : '',
        item?.ui_download_name ? `任务: ${item.ui_download_name}` : '',
        speed ? `速度: ${speed}` : '',
    ].filter(Boolean);
    const title = titleParts.join(' · ') || '下载器中已有该任务';
    if (status === 'completed') {
        return {
            label,
            icon: 'fa-solid fa-circle-check',
            className: 'bg-emerald-500 text-white shadow-sm shadow-emerald-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    if (status === 'paused') {
        return {
            label,
            icon: 'fa-solid fa-circle-pause',
            className: 'bg-amber-500 text-white shadow-sm shadow-amber-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    if (status === 'error') {
        return {
            label,
            icon: 'fa-solid fa-triangle-exclamation',
            className: 'bg-red-500 text-white shadow-sm shadow-red-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    if (status === 'queued' || status === 'checking' || status === 'stalled') {
        return {
            label,
            icon: 'fa-solid fa-clock',
            className: 'bg-slate-500 text-white shadow-sm shadow-slate-500/25 cursor-default',
            disabled: true,
            title,
        };
    }
    return {
        label,
        icon: 'fa-solid fa-circle-down',
        className: 'bg-sky-500 text-white shadow-sm shadow-sky-500/25 cursor-default',
        disabled: true,
        title,
    };
}

function moviepilotResolverAction(item) {
    const matchKind = String(item?.ui_episode_match_kind || '');
    const downloadMode = String(item?.ui_download_mode || '');
    const pending = gapState.pending || {};
    const pendingFullSeries = pending.fullSeries === true;
    const pendingTargets = Array.isArray(pending.targets) ? pending.targets : [];
    const pendingSeasonOnly = pendingTargets.length > 0 && pendingTargets.every(target => (
        target?.season_missing === true && !(Array.isArray(target?.episodes) && target.episodes.length)
    ));
    const itemTargets = Array.isArray(item?.ui_gap_targets) ? item.ui_gap_targets : [];
    const itemSeasonOnly = itemTargets.some(target => (
        target?.season_missing === true || (target?.match_kind === 'season_pack' && !(Array.isArray(target?.episodes) && target.episodes.length))
    ));
    const forceDirect = pendingFullSeries || (matchKind === 'season_pack' && (pendingSeasonOnly || itemSeasonOnly || downloadMode === 'normal'));
    const shouldSplit = !forceDirect && (downloadMode === 'split' || (!downloadMode && ['episode_pack', 'season_pack'].includes(matchKind)));
    if (item?.ui_transfer_pending === true) {
        const pendingLabel = shouldSplit ? '正在拆包' : '正在下载';
        return {
            label: pendingLabel,
            icon: 'fa-solid fa-circle-notch fa-spin',
            className: 'bg-sky-500 text-white shadow-sm shadow-sky-500/30 cursor-wait',
            disabled: true,
            title: '正在提交下载任务',
        };
    }
    if (item?.ui_download_task === true) {
        return moviepilotDownloadTaskAction(item);
    }
    if (item?.ui_download_blocked === true || matchKind === 'none') {
        return {
            label: '不匹配',
            icon: 'fa-solid fa-ban',
            className: 'bg-gray-200 hover:bg-gray-300 text-gray-600 dark:bg-white/10 dark:hover:bg-white/15 dark:text-gray-300 shadow-sm shadow-gray-300/20 active:scale-95',
            disabled: false,
            title: item?.ui_download_block_reason || '不匹配，点击仍会强制提交',
        };
    }
    if (shouldSplit) {
        return {
            label: '拆包下载',
            icon: 'fa-solid fa-list-check',
            className: 'bg-indigo-500 hover:bg-indigo-600 text-white shadow-sm shadow-indigo-500/25 active:scale-95',
            disabled: false,
            title: item?.ui_download_hint || '提交后只选择缺失集数文件',
        };
    }
    if (pendingFullSeries || matchKind === 'full_series' || item?.ui_full_series === true) {
        return {
            label: '下载全集',
            icon: 'fa-solid fa-download',
            className: 'bg-amber-500 hover:bg-amber-600 text-white shadow-sm shadow-amber-500/25 active:scale-95',
            disabled: false,
            title: '下载全集资源',
        };
    }
    if (matchKind === 'season_pack') {
        return {
            label: '下载整季',
            icon: 'fa-solid fa-download',
            className: 'bg-brand-500 hover:bg-brand-600 text-white active:scale-95',
            disabled: false,
            title: item?.ui_download_hint || '提交 MoviePilot 下载整季资源',
        };
    }
    return {
        label: '下载',
        icon: 'fa-solid fa-download',
        className: 'bg-brand-500 hover:bg-brand-600 text-white active:scale-95',
        disabled: false,
        title: '下载缺失集数',
    };
}

function episodeLabel(season, episode) {
    if (Number(episode || 0) <= 0) return `S${String(season).padStart(2, '0')}`;
    return `S${String(season).padStart(2, '0')}E${String(episode).padStart(2, '0')}`;
}

function isSeasonMissingGap(item) {
    return item?.season_missing === true || String(item?.source || '') === 'season_inferred' || Number(item?.episode || 0) <= 0;
}

function gapAutoFillKey(seriesId, season) {
    return `${String(seriesId || '')}:S${String(Number(season || 0)).padStart(2, '0')}`;
}

function gapAutoFillJobResults(job) {
    const results = Array.isArray(job?.last_results) ? job.last_results.filter(Boolean) : [];
    if (results.length) return results;
    const legacyTitle = String(job?.last_resource_title || '').trim();
    return legacyTitle ? [{
        title: legacyTitle,
        selected: true,
        eligible: true,
        legacy: true,
    }] : [];
}

function gapAutoFillStatusMeta(job) {
    const status = String(job?.status || 'waiting');
    const map = {
        searching: ['搜索中', 'fa-circle-notch fa-spin', 'bg-cyan-50 dark:bg-cyan-500/10 text-cyan-700 dark:text-cyan-300'],
        transferring: ['转存中', 'fa-circle-notch fa-spin', 'bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-300'],
        completed: ['已完成', 'fa-circle-check', 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300'],
        error: ['失败', 'fa-triangle-exclamation', 'bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-300'],
        blocked: ['已阻止', 'fa-ban', 'bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300'],
        disabled: ['已关闭', 'fa-pause', 'bg-gray-100 dark:bg-white/5 text-gray-500 dark:text-gray-400'],
        waiting: ['等待', 'fa-clock', 'bg-gray-100 dark:bg-white/5 text-gray-600 dark:text-gray-300'],
    };
    const [label, icon, className] = map[status] || map.waiting;
    return {status, label, icon, className};
}

function gapAutoFillFilterMatch(job, filter) {
    const status = String(job?.status || 'waiting');
    if (filter === 'matched') return gapAutoFillJobResults(job).length > 0;
    if (filter === 'waiting') return ['waiting', 'searching', 'transferring'].includes(status) && Boolean(job?.enabled);
    if (filter === 'completed') return status === 'completed';
    if (filter === 'issues') return ['error', 'blocked'].includes(status);
    return true;
}

function setGapAutoFillPanelFilter(filter) {
    gapState.autoFillPanelFilter = String(filter || 'all');
    renderGapAutoFillPanel();
}

function renderGapAutoFillResource(result) {
    const title = String(result?.title || '未知资源');
    const previewUrl = safeHttpUrl(result?.page_url);
    const size = result?.share_size || (Number(result?.size_bytes || 0) > 0 ? formatBytes(result.size_bytes) : '');
    const resolution = joinList(result?.resolution);
    const source = joinList(result?.source);
    const points = result?.unlock_points;
    const pointsNumber = Number(points);
    let accessBadge = '<span class="px-2 py-1 rounded-md bg-gray-100 dark:bg-white/5 text-gray-500">不可自动</span>';
    if (result?.is_unlocked) {
        accessBadge = '<span class="px-2 py-1 rounded-md bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-300">已解锁</span>';
    } else if (points !== '' && points !== undefined && Number.isFinite(pointsNumber) && pointsNumber <= 0) {
        accessBadge = '<span class="px-2 py-1 rounded-md bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-300">免费</span>';
    } else if (result?.eligible) {
        accessBadge = '<span class="px-2 py-1 rounded-md bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-300">可自动</span>';
    } else if (points !== '' && points !== undefined) {
        accessBadge = `<span class="px-2 py-1 rounded-md bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300">${escapeHtml(points)} 积分</span>`;
    }
    const titleHtml = previewUrl
        ? `<a href="${escapeHtml(previewUrl)}" target="_blank" rel="noopener noreferrer" class="font-black text-sm text-gray-900 dark:text-white hover:text-cyan-500 transition-colors"><span>${escapeHtml(title)}</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>`
        : `<div class="font-black text-sm text-gray-900 dark:text-white">${escapeHtml(title)}</div>`;
    return `
        <div class="py-2.5 border-t first:border-t-0 border-gray-100 dark:border-white/5">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                    ${titleHtml}
                    <div class="flex flex-wrap items-center gap-1.5 mt-1.5 text-[10px] font-black">
                        ${result?.selected ? '<span class="px-2 py-1 rounded-md bg-cyan-50 dark:bg-cyan-500/10 text-cyan-700 dark:text-cyan-300">已选资源</span>' : ''}
                        ${result?.is_official ? '<span class="px-2 py-1 rounded-md bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300">官组</span>' : ''}
                        ${size ? `<span class="px-2 py-1 rounded-md bg-gray-100 dark:bg-white/5 text-gray-500">${escapeHtml(size)}</span>` : ''}
                        ${resolution ? `<span class="px-2 py-1 rounded-md bg-gray-100 dark:bg-white/5 text-gray-500">${escapeHtml(resolution)}</span>` : ''}
                        ${source ? `<span class="px-2 py-1 rounded-md bg-gray-100 dark:bg-white/5 text-gray-500">${escapeHtml(source)}</span>` : ''}
                        ${result?.match_text ? `<span class="px-2 py-1 rounded-md bg-cyan-50 dark:bg-cyan-500/10 text-cyan-700 dark:text-cyan-300">${escapeHtml(result.match_text)}</span>` : ''}
                        ${accessBadge}
                    </div>
                    ${result?.sharer ? `<div class="mt-1.5 text-[11px] text-gray-400">分享者：${escapeHtml(result.sharer)}</div>` : ''}
                    ${result?.remark ? `<div class="mt-1.5 text-[11px] text-gray-500 dark:text-gray-400 line-clamp-2">${escapeHtml(result.remark)}</div>` : ''}
                </div>
            </div>
        </div>
    `;
}

function renderGapAutoFillJob(job) {
    const status = gapAutoFillStatusMeta(job);
    const results = gapAutoFillJobResults(job);
    const season = Number(job?.season_number || 0);
    const metadata = [
        job?.library_name,
        job?.year,
        Number(job?.attempts || 0) > 0 ? `尝试 ${Number(job.attempts)}` : '',
        job?.last_run_at ? `最近 ${shortDateTime(job.last_run_at)}` : '',
    ].filter(Boolean).join(' · ');
    return `
        <div class="px-4 py-4 border-b last:border-b-0 border-gray-100 dark:border-white/5">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="font-black text-sm text-gray-900 dark:text-white">${escapeHtml(job?.series_name || job?.series_id || '未知剧集')}</span>
                        <span class="px-2 py-1 rounded-md bg-gray-100 dark:bg-white/5 text-[10px] font-black text-gray-600 dark:text-gray-300">S${String(season).padStart(2, '0')}</span>
                    </div>
                    ${metadata ? `<div class="mt-1 text-[11px] font-bold text-gray-400">${escapeHtml(metadata)}</div>` : ''}
                </div>
                <span class="shrink-0 px-2.5 py-1.5 rounded-lg text-[10px] font-black ${status.className}">
                    <i class="fa-solid ${status.icon} mr-1"></i>${status.label}
                </span>
            </div>
            ${job?.last_message ? `<div class="mt-2 text-xs font-bold text-gray-600 dark:text-gray-300">${escapeHtml(job.last_message)}</div>` : ''}
            ${results.length ? `<div class="mt-2 pl-3 border-l-2 border-cyan-200 dark:border-cyan-500/30">${results.slice(0, 6).map(renderGapAutoFillResource).join('')}</div>` : '<div class="mt-2 text-[11px] font-bold text-gray-400">尚未保存命中资源</div>'}
        </div>
    `;
}

function renderGapAutoFillPanel() {
    const body = document.getElementById('gapAutoFillPanelBody');
    const filters = document.getElementById('gapAutoFillFilters');
    const sub = document.getElementById('gapAutoFillPanelSub');
    const summary = document.getElementById('gapAutoFillPanelSummary');
    const toggle = document.getElementById('gapAutoFillMasterToggle');
    if (!body || !filters || !sub || !summary || !toggle) return;

    const jobs = [...gapState.autoFillJobs.values()].filter(
        job => String(job?.status || 'waiting') !== 'completed'
    );
    const counts = {
        all: jobs.length,
        matched: jobs.filter(job => gapAutoFillJobResults(job).length > 0).length,
        waiting: jobs.filter(job => gapAutoFillFilterMatch(job, 'waiting')).length,
        issues: jobs.filter(job => gapAutoFillFilterMatch(job, 'issues')).length,
    };
    const filterItems = [
        ['all', '全部', counts.all],
        ['waiting', '等待', counts.waiting],
        ['matched', '命中', counts.matched],
        ['issues', '异常', counts.issues],
    ];
    filters.innerHTML = filterItems.map(([key, label, value]) => {
        const active = gapState.autoFillPanelFilter === key;
        const className = active
            ? 'bg-cyan-500 text-white border-cyan-500'
            : 'bg-gray-50 dark:bg-white/5 text-gray-500 dark:text-gray-300 border-gray-200 dark:border-white/10 hover:text-cyan-500';
        return `<button type="button" aria-pressed="${active ? 'true' : 'false'}" onclick="setGapAutoFillPanelFilter('${key}')" class="shrink-0 px-3 py-2 rounded-lg border text-[11px] font-black transition-colors ${className}">${label} ${value}</button>`;
    }).join('');

    const query = String(gapState.autoFillPanelQuery || '').trim().toLowerCase();
    const visible = jobs.filter(job => {
        if (!gapAutoFillFilterMatch(job, gapState.autoFillPanelFilter)) return false;
        if (!query) return true;
        const resourceText = gapAutoFillJobResults(job).map(item => item?.title || '').join(' ');
        return [
            job?.series_name,
            `S${String(Number(job?.season_number || 0)).padStart(2, '0')}`,
            job?.library_name,
            job?.last_message,
            resourceText,
        ].join(' ').toLowerCase().includes(query);
    }).sort((a, b) => {
        const matchDiff = gapAutoFillJobResults(b).length - gapAutoFillJobResults(a).length;
        if (matchDiff) return matchDiff;
        const nameDiff = String(a?.series_name || '').localeCompare(String(b?.series_name || ''), 'zh-CN');
        return nameDiff || Number(a?.season_number || 0) - Number(b?.season_number || 0);
    });

    sub.textContent = `${gapState.autoFillEnabled ? '已启用' : '已关闭'} · 仅自动转存免费或已解锁的影巢整季资源`;
    summary.textContent = `显示 ${visible.length}/${jobs.length} · 已保存命中 ${counts.matched} · 等待 ${counts.waiting}`;
    toggle.disabled = gapState.autoFillGlobalBusy;
    toggle.setAttribute('aria-pressed', gapState.autoFillEnabled ? 'true' : 'false');
    toggle.className = `px-4 py-2 rounded-xl text-xs font-black transition-all active:scale-95 flex items-center justify-center gap-2 disabled:opacity-60 ${
        gapState.autoFillEnabled
            ? 'bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-300 hover:bg-red-100 dark:hover:bg-red-500/20'
            : 'bg-emerald-500 hover:bg-emerald-600 text-white'
    }`;
    toggle.innerHTML = gapState.autoFillGlobalBusy
        ? '<i class="fa-solid fa-circle-notch fa-spin"></i><span>处理中</span>'
        : (gapState.autoFillEnabled
            ? '<i class="fa-solid fa-stop"></i><span>关闭自动补季</span>'
            : '<i class="fa-solid fa-clock"></i><span>启用自动补季</span>');

    if (gapState.autoFillPanelLoading) {
        body.innerHTML = '<div class="py-20 text-center text-gray-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i></div>';
    } else if (!visible.length) {
        const message = gapState.autoFillPanelFilter === 'matched'
            ? '暂无已保存的命中资源，下一次定时搜索后会在这里更新'
            : '当前筛选下没有任务';
        body.innerHTML = `<div class="py-20 text-center text-sm font-bold text-gray-400">${message}</div>`;
    } else {
        body.innerHTML = visible.map(renderGapAutoFillJob).join('');
    }
}

async function refreshGapAutoFillPanel() {
    gapState.autoFillPanelLoading = true;
    renderGapAutoFillPanel();
    try {
        const data = await gapApi(`/api/gaps/auto-fill?_t=${Date.now()}`);
        const payload = data.data || {};
        gapState.autoFillEnabled = payload.enabled === true;
        gapState.autoFillState = payload.run || {};
        gapState.autoFillJobs = new Map(
            (Array.isArray(payload.jobs) ? payload.jobs : []).map(job => [
                gapAutoFillKey(job.series_id, job.season_number),
                job,
            ])
        );
        updateGapAutoFillButton(gapState.scanStatus);
    } catch (e) {
        showToast('error', '任务加载失败', e.message);
    } finally {
        gapState.autoFillPanelLoading = false;
        renderGapAutoFillPanel();
    }
}

function openGapAutoFillPanel() {
    gapState.autoFillPanelFilter = 'all';
    gapState.autoFillPanelQuery = '';
    const search = document.getElementById('gapAutoFillSearch');
    if (search) search.value = '';
    showGapModal('gapAutoFillModal');
    refreshGapAutoFillPanel();
}

function closeGapAutoFillPanel() {
    hideGapModal('gapAutoFillModal');
}

async function toggleGapAutoFillAll() {
    if (gapState.autoFillGlobalBusy) return;
    const enabled = !gapState.autoFillEnabled;
    gapState.autoFillGlobalBusy = true;
    updateGapAutoFillButton(gapState.scanStatus);
    try {
        const data = await gapApi('/api/gaps/auto-fill/toggle-all', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({enabled}),
        });
        const payload = data.data || {};
        gapState.autoFillEnabled = payload.enabled === true;
        gapState.autoFillJobs = new Map(
            (Array.isArray(payload.jobs) ? payload.jobs : []).map(job => [
                gapAutoFillKey(job.series_id, job.season_number),
                job,
            ])
        );
        showToast('success', enabled ? '已启用自动补季' : '已关闭自动补季', data.message || '');
    } catch (e) {
        showToast('error', enabled ? '启用失败' : '取消失败', e.message);
    } finally {
        gapState.autoFillGlobalBusy = false;
        updateGapAutoFillButton(gapState.scanStatus);
        renderGapAutoFillPanel();
    }
}

function isGapAnomaly(item) {
    return item?.anomaly === true || Boolean(item?.anomaly_type);
}

function seriesGapAnomalies(series) {
    return (series?.gaps || []).filter(isGapAnomaly);
}

function gapAnomalyText(item) {
    return item?.anomaly_message || '本地季号与 TMDB 季信息不一致，可能是入库季号错误';
}

function seriesAnomalyText(series) {
    const anomalies = seriesGapAnomalies(series);
    if (!anomalies.length) return '';
    return anomalies.map(gap => `S${String(gap.season || 0).padStart(2, '0')}: ${gapAnomalyText(gap)}`).join('；');
}

function gapMissingSummary(series) {
    const gaps = Array.isArray(series?.gaps) ? series.gaps : [];
    const seasonCount = gaps.filter(isSeasonMissingGap).length;
    const episodeCount = gaps.length - seasonCount;
    if (seasonCount && episodeCount) return `缺 ${episodeCount} 集/${seasonCount} 季`;
    if (seasonCount) return `缺 ${seasonCount} 季`;
    return `缺 ${episodeCount} 集`;
}

function groupGaps(series) {
    const grouped = {};
    (series.gaps || []).forEach(ep => {
        const season = Number(ep.season || 0);
        if (!grouped[season]) grouped[season] = [];
        grouped[season].push(ep);
    });
    return Object.keys(grouped).map(season => ({
        season: Number(season),
        episodes: grouped[season].sort((a, b) => Number(a.episode) - Number(b.episode)),
    })).sort((a, b) => a.season - b.season);
}

function seriesGapTargets(series) {
    const targets = [];
    groupGaps(series).forEach(group => {
        const season = Number(group.season || 0);
        const missingSeason = group.episodes.find(isSeasonMissingGap);
        if (missingSeason) {
            const seasonDate = String(missingSeason.date || '');
            targets.push({
                season,
                episodes: [],
                season_missing: true,
                season_title: missingSeason.season_title || missingSeason.title || '',
                season_year: Number(seasonDate.slice(0, 4)) || '',
            });
        }
        const episodes = group.episodes
            .filter(ep => !isSeasonMissingGap(ep))
            .map(ep => Number(ep.episode || 0))
            .filter(Boolean);
        if (episodes.length) targets.push({season, episodes});
    });
    return targets;
}

function episodeListText(episodes) {
    const nums = (episodes || []).map(v => Number(v || 0)).filter(Boolean).sort((a, b) => a - b);
    if (!nums.length) return '';
    if (nums.length > 1 && nums.every((num, idx) => idx === 0 || num === nums[idx - 1] + 1)) {
        return `E${String(nums[0]).padStart(2, '0')}-E${String(nums[nums.length - 1]).padStart(2, '0')}`;
    }
    return nums.slice(0, 8).map(e => `E${String(e).padStart(2, '0')}`).join(', ') + (nums.length > 8 ? ` +${nums.length - 8}` : '');
}

function gapTargetLabel(targets) {
    const items = (targets || []).filter(target => target.season_missing === true || (target.episodes || []).length);
    if (!items.length) return '全部缺失';
    const parts = items.slice(0, 4).map(target => (
        target.season_missing === true && !(target.episodes || []).length
            ? `S${String(target.season).padStart(2, '0')} 整季`
            : `S${String(target.season).padStart(2, '0')} ${episodeListText(target.episodes)}`
    ));
    return parts.join(' / ') + (items.length > 4 ? ` / +${items.length - 4}季` : '');
}

function gapSubscriptionKey(series) {
    return String(series?.series_id || series?.series_name || '').trim();
}

function gapSubscriptionState(series) {
    return gapState.subscriptionStatus.get(gapSubscriptionKey(series)) || null;
}

function gapSubscriptionSeasonLabel(seasons) {
    const values = (seasons || []).map(value => Number(value)).filter(value => Number.isInteger(value) && value >= 0);
    return values.map(season => `S${String(season).padStart(2, '0')}`).join(' / ');
}

async function loadGapSubscriptionStatus(force = false) {
    const items = gapState.items.map(series => ({
        series_id: String(series.series_id || ''),
        series_name: String(series.series_name || ''),
        tmdb_id: Number(series.tmdb_id || 0),
        seasons: [...new Set(seriesGapTargets(series).map(target => Number(target.season)).filter(season => Number.isInteger(season) && season >= 0))].sort((a, b) => a - b),
    })).filter(item => item.tmdb_id > 0 && item.seasons.length > 0);
    const signature = JSON.stringify(items.map(item => [item.series_id, item.tmdb_id, item.seasons]));
    const recentlyChecked = Date.now() - Number(gapState.subscriptionStatusCheckedAt || 0) < 60000;
    if (!force && signature === gapState.subscriptionStatusSignature && recentlyChecked) return;
    if (!items.length) {
        gapState.subscriptionStatus = new Map();
        gapState.subscriptionStatusSignature = signature;
        gapState.subscriptionStatusCheckedAt = Date.now();
        return;
    }
    const token = ++gapState.subscriptionStatusToken;
    try {
        const data = await gapApiWithTimeout('/api/gaps/subscription_status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({items}),
        }, 20000);
        if (token !== gapState.subscriptionStatusToken) return;
        gapState.subscriptionStatus = new Map(
            (data.data?.items || []).map(item => [String(item.series_id || item.series_name || ''), item])
        );
        gapState.subscriptionStatusSignature = signature;
        gapState.subscriptionStatusCheckedAt = Date.now();
        renderGapResults();
        if (!document.getElementById('gapFilesModal')?.classList.contains('hidden')) renderGapFiles();
    } catch (e) {
        if (token === gapState.subscriptionStatusToken) gapState.subscriptionStatusCheckedAt = Date.now();
    }
}

async function loadGapStatus() {
    try {
        const [gapData, scanMonitor] = await Promise.all([
            gapApi('/api/gaps/scan/progress'),
            loadSharedScanMonitor(),
        ]);
        gapState.scanMonitor = scanMonitor;
        applyGapStatus(gapData.data || {});
    } catch (e) {
        document.getElementById('gapLoading').classList.add('hidden');
        showToast('error', '加载失败', e.message);
    }
}

function applyGapStatus(status) {
    const running = !!status.is_scanning;
    const nextError = String(status?.error || status?.auto_fill?.error || '').trim();
    if (!nextError) gapState.dismissedProgressError = '';
    gapState.scanStatus = status || {};
    gapState.items = Array.isArray(status.results) ? status.results : [];
    gapState.summary = status.summary || {};
    gapState.autoFillState = status.auto_fill || {};
    gapState.autoFillEnabled = status.auto_fill_enabled === true;
    gapState.autoFillJobs = new Map(
        (Array.isArray(status.auto_fill_jobs) ? status.auto_fill_jobs : []).map(job => [
            gapAutoFillKey(job.series_id, job.season_number),
            job,
        ])
    );
    document.getElementById('gapLoading').classList.add('hidden');
    const emptyText = document.querySelector('#gapEmpty p');
    if (emptyText) {
        emptyText.textContent = running ? '扫描中，缺集记录会陆续出现' : '暂无缺集记录';
    }
    updateGapStats(status);
    updateGapProgress(status);
    updateGapAutoFillButton(status);
    if (!document.getElementById('gapAutoFillModal')?.classList.contains('hidden')) {
        renderGapAutoFillPanel();
    }
    renderGapLibrarySwitch();
    renderGapResults();
    loadGapSubscriptionStatus();
    if ((running || status.auto_fill?.is_running) && !gapState.pollTimer) startGapPolling();
}

function updateGapStats(status = {}) {
    const summary = gapState.summary || {};
    const autoFill = status.auto_fill || {};
    const autoRunning = !!autoFill.is_running;
    const seriesCount = summary.series_count ?? gapState.items.length;
    const gapCount = summary.gap_count ?? gapState.items.reduce((sum, item) => sum + (item.gaps || []).length, 0);
    const processed = summary.processed ?? status.processed ?? 0;
    const total = summary.total ?? status.total ?? 0;
    document.getElementById('statSeries').textContent = seriesCount;
    document.getElementById('statGaps').textContent = gapCount;
    document.getElementById('statProcessed').textContent = autoRunning
        ? `${autoFill.processed || 0}/${autoFill.total || 0}`
        : (status.is_scanning && total ? `${processed}/${total}` : processed);
    document.getElementById('statState').textContent = status.is_scanning
        ? '扫描中'
        : (autoRunning ? '影巢补季' : (status.error || autoFill.error ? '异常' : '空闲'));
    document.getElementById('gapLibraryCount').textContent = `剧集库 ${summary.library_count ?? 0}`;
    const scanMonitor = gapState.scanMonitor || {};
    const scanSummary = scanMonitor.summary || {};
    const scanTime = scanMonitor.scan_time || scanSummary.scan_time || scanMonitor.cache?.created_at || '';
    const scanTimeEl = document.getElementById('gapCacheTime');
    if (status.created_at) {
        scanTimeEl.textContent = `缺集扫描: ${status.created_at}`;
        const nextScan = status.schedule?.next_scan;
        scanTimeEl.title = nextScan ? `下次缺集扫描: ${nextScan}` : '缺集缓存更新时间';
    } else if (scanTime) {
        scanTimeEl.textContent = `质量扫描: ${scanTime}`;
        const nextScan = scanMonitor.schedule?.next_scan;
        scanTimeEl.title = nextScan ? `下次质量扫描: ${nextScan}` : '与仪表盘同步的扫描时间';
    } else {
        scanTimeEl.textContent = '等待扫描';
        scanTimeEl.removeAttribute('title');
    }
}

function updateGapAutoFillButton(status = {}) {
    const btn = document.getElementById('gapAutoFillBtn');
    const icon = document.getElementById('gapAutoFillIcon');
    const label = document.getElementById('gapAutoFillLabel');
    const count = document.getElementById('gapAutoFillCount');
    if (!btn || !icon || !label || !count) return;

    const enabled = gapState.autoFillEnabled === true;
    const running = !!status.auto_fill?.is_running;
    const activeCount = [...gapState.autoFillJobs.values()].filter(job => (
        job?.enabled === true || Number(job?.enabled || 0) === 1
    )).length;
    const baseClass = 'px-3 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 border flex items-center gap-2 disabled:opacity-60';
    const enabledClass = 'bg-emerald-50 dark:bg-emerald-500/10 hover:bg-emerald-100 dark:hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border-emerald-100 dark:border-emerald-500/20';
    const disabledClass = 'bg-cyan-50 dark:bg-cyan-500/10 hover:bg-cyan-100 dark:hover:bg-cyan-500/20 text-cyan-700 dark:text-cyan-300 border-cyan-100 dark:border-cyan-500/20';

    btn.className = `${baseClass} ${enabled ? enabledClass : disabledClass}`;
    btn.disabled = gapState.autoFillGlobalBusy;
    icon.className = `fa-solid ${gapState.autoFillGlobalBusy || running ? 'fa-circle-notch fa-spin' : (enabled ? 'fa-clock-rotate-left' : 'fa-clock')}`;
    label.textContent = running ? '补季中' : '自动补季';
    count.textContent = String(activeCount);
    count.classList.toggle('hidden', !enabled || activeCount <= 0);
    count.classList.toggle('inline-flex', enabled && activeCount > 0);
    btn.title = enabled
        ? `查看影巢自动补季任务${activeCount ? `，等待任务 ${activeCount}` : ''}`
        : '查看影巢自动补季任务（当前关闭）';
}

function dismissGapProgress() {
    const status = gapState.scanStatus || {};
    const autoFill = status.auto_fill || {};
    const err = String(status.error || autoFill.error || '').trim();
    gapState.dismissedProgressError = err;
    updateGapProgress(status);
}

function updateGapProgress(status = {}) {
    const card = document.getElementById('gapProgressCard');
    const scanBtn = document.getElementById('gapScanBtn');
    const icon = document.getElementById('gapProgressIcon');
    const track = document.getElementById('gapProgressTrack');
    const bar = document.getElementById('gapProgressBar');
    const pct = document.getElementById('gapProgressPct');
    const textEl = document.getElementById('gapProgressText');
    const dismissBtn = document.getElementById('gapProgressDismiss');
    if (!card || !scanBtn || !icon || !track || !bar || !pct || !textEl) return;

    const autoFill = status.auto_fill || {};
    const autoRunning = !!autoFill.is_running;
    const scanning = !!status.is_scanning;
    const running = scanning || autoRunning;
    const active = scanning ? status : autoFill;
    const errorText = String(status.error || autoFill.error || '').trim();
    const dismissed = gapState.dismissedProgressError && gapState.dismissedProgressError === errorText;
    const showError = !!errorText && !running && !dismissed;
    const showCard = running || showError;

    card.classList.toggle('hidden', !showCard);
    card.classList.toggle('border', showError);
    card.classList.toggle('border-amber-200', showError);
    card.classList.toggle('dark:border-amber-500/30', showError);
    card.classList.toggle('bg-amber-50/80', showError);
    card.classList.toggle('dark:bg-amber-500/10', showError);
    scanBtn.disabled = running;
    scanBtn.classList.toggle('opacity-60', running);

    if (running) {
        icon.className = 'fa-solid fa-circle-notch fa-spin text-brand-500 text-lg';
        track.classList.remove('hidden');
        pct.classList.remove('hidden');
        if (dismissBtn) dismissBtn.classList.add('hidden');
        const progress = Math.max(0, Math.min(100, Number(active.progress || 0)));
        bar.style.width = progress + '%';
        bar.className = 'bg-cyan-500 h-full rounded-full transition-all duration-300';
        pct.textContent = progress + '%';
        textEl.className = 'text-sm font-bold text-gray-700 dark:text-gray-200 truncate';
        textEl.textContent = active.current_item || (scanning ? '扫描中...' : '影巢补季中...');
        return;
    }

    if (showError) {
        icon.className = 'fa-solid fa-triangle-exclamation text-amber-500 text-lg';
        track.classList.add('hidden');
        pct.classList.add('hidden');
        if (dismissBtn) dismissBtn.classList.remove('hidden');
        textEl.className = 'text-sm font-bold text-amber-700 dark:text-amber-300 truncate';
        textEl.textContent = errorText;
        return;
    }

    track.classList.remove('hidden');
    pct.classList.remove('hidden');
    if (dismissBtn) dismissBtn.classList.add('hidden');
}

async function startGapScan() {
    try {
        gapState.dismissedProgressError = '';
        await gapApi('/api/gaps/scan/start', { method: 'POST' });
        showToast('success', '已启动扫描');
        startGapPolling();
    } catch (e) {
        showToast('error', '启动失败', e.message);
    }
}

async function refreshGapSeries(seriesId) {
    const id = String(seriesId || '').trim();
    if (!id || gapState.refreshingSeries.has(id)) return;
    gapState.refreshingSeries.add(id);
    renderGapResults();
    const slowHintTimer = setTimeout(() => {
        if (gapState.refreshingSeries.has(id)) {
            showToast('info', '仍在刷新', '正在等待 Emby / MoviePilot 返回，请稍候');
        }
    }, 8000);
    try {
        const data = await gapApi('/api/gaps/refresh_series', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ series_id: id }),
        });
        const status = (data.data || {}).status;
        if (status) {
            applyGapStatus(status);
        } else {
            await loadGapStatus();
        }
        showToast('success', '刷新完成', data.message || '该剧缺集数据已更新');
    } catch (e) {
        showToast('error', '刷新失败', e.message);
    } finally {
        clearTimeout(slowHintTimer);
        gapState.refreshingSeries.delete(id);
        renderGapResults();
    }
}

function startGapPolling() {
    if (gapState.pollTimer) {
        clearInterval(gapState.pollTimer);
        gapState.pollTimer = null;
    }
    const tick = async () => {
        try {
            const data = await gapApi(`/api/gaps/scan/progress?_t=${Date.now()}`);
            applyGapStatus(data.data || {});
            if (!data.data?.is_scanning && !data.data?.auto_fill?.is_running) {
                clearInterval(gapState.pollTimer);
                gapState.pollTimer = null;
            }
        } catch (e) {
            clearInterval(gapState.pollTimer);
            gapState.pollTimer = null;
            showToast('error', '轮询失败', e.message);
        }
    };
    tick();
    gapState.pollTimer = setInterval(tick, 1000);
}

function filteredGapItems() {
    const keyword = (document.getElementById('gapSearchInput')?.value || '').trim().toLowerCase();
    let items = [...gapState.items];
    if (gapState.activeLibrary) {
        items = items.filter(item => gapLibraryName(item) === gapState.activeLibrary);
    }
    if (keyword) {
        items = items.filter(item => [
            item.series_name, item.tmdb_id, item.imdb_id, item.library_name
        ].some(v => String(v || '').toLowerCase().includes(keyword)));
    }
    return items;
}

function sortGapItems(items, sort) {
    items = [...items];
    if (sort === 'name_asc') {
        items.sort((a, b) => String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN'));
    } else if (sort === 'library_asc') {
        items.sort((a, b) => (
            String(a.library_name || '').localeCompare(String(b.library_name || ''), 'zh-CN')
            || String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN')
        ));
    } else {
        items.sort((a, b) => (
            (b.gaps || []).length - (a.gaps || []).length
            || String(a.series_name || '').localeCompare(String(b.series_name || ''), 'zh-CN')
        ));
    }
    return items;
}

function gapLibraryName(series) {
    return String(series.library_name || '').trim() || '未分类媒体库';
}

function gapLibraryStats() {
    const grouped = new Map();
    gapState.items.forEach(item => {
        const library = gapLibraryName(item);
        if (!grouped.has(library)) grouped.set(library, { library, seriesCount: 0, gapCount: 0 });
        const stat = grouped.get(library);
        stat.seriesCount += 1;
        stat.gapCount += (item.gaps || []).length;
    });
    return Array.from(grouped.values()).sort((a, b) => a.library.localeCompare(b.library, 'zh-CN'));
}

function renderGapLibrarySwitch() {
    const container = document.getElementById('gapLibrarySwitch');
    if (!container) return;
    const stats = gapLibraryStats();
    if (gapState.activeLibrary && !stats.some(item => item.library === gapState.activeLibrary)) {
        gapState.activeLibrary = '';

        label: '全部',
        seriesCount: gapState.items.length,

    const buttons = [total, ...stats.map(item => ({ ...item, label: item.library }))];

        return `
            <button type="button" aria-pressed="${active ? 'true' : 'false'}" onclick='setGapLibraryFilter(${jsString(item.library)})' class="px-3 py-2 rounded-xl border ${activeClass} text-xs font-black transition-all active:scale-95">

function setGapLibraryFilter(library) {
    gapState.activeLibrary = String(library || '');

}

function groupItemsByLibrary(items) {
    const sort = document.getElementById('gapSortSelect')?.value || 'gap_desc';
    const grouped = new Map();
    items.forEach(item => {
        const library = gapLibraryName(item);
        if (!grouped.has(library)) grouped.set(library, []);
        grouped.get(library).push(item);
    });
    return Array.from(grouped.entries()).map(([library, series]) => ({
        library,
        series: sortGapItems(series, sort === 'library_asc' ? 'name_asc' : sort),
        gapCount: series.reduce((sum, item) => sum + (item.gaps || []).length, 0),
    })).sort((a, b) => a.library.localeCompare(b.library, 'zh-CN'));
}

function compactEpisodeRange(episodes) {
    if (!Array.isArray(episodes) || episodes.length < 6) return null;
    const numbers = episodes.map(ep => Number(ep.episode || 0));
    if (numbers.some(num => !Number.isInteger(num) || num <= 0)) return null;
    const unique = new Set(numbers);
    if (unique.size !== numbers.length) return null;
    const sorted = [...numbers].sort((a, b) => a - b);
    for (let i = 1; i < sorted.length; i += 1) {
        if (sorted[i] !== sorted[i - 1] + 1) return null;
    }
    return {
        start: sorted[0],
        end: sorted[sorted.length - 1],
        count: sorted.length,
        isPending: episodes.every(ep => Number(ep.status) === 2),
    };
}

function compactRangeLabel(range) {
    return `E${String(range.start).padStart(2, '0')}-E${String(range.end).padStart(2, '0')}`;
}

function filterGapFileEpisodes(episodes, filter) {
    if (filter === 'missing') return episodes.filter(item => item.missing);
    if (filter === 'present') return episodes.filter(item => !item.missing);
    if (filter === 'virtual') return episodes.filter(item => item.virtual);
    if (filter === 'season_missing') return episodes.filter(isSeasonMissingGap);
    return episodes;
}

function setGapFileFilter(filter) {
    const next = ['all', 'present', 'missing', 'virtual', 'season_missing'].includes(String(filter || '')) ? String(filter) : 'all';
    if (gapState.fileFilter === next) return;
    gapState.fileFilter = next;
    renderGapFiles();
    const body = document.getElementById('gapFilesBody');
    if (body) body.scrollTop = 0;
}

function toggleGapFileSeason(season) {
    const seasonNumber = Number(season || 0);
    const key = String(seasonNumber);
    const section = document.querySelector(`[data-gap-files-season="${key}"]`);
    if (!section) return;
    const button = section.querySelector('.gap-files-season-head');
    const panel = section.querySelector('.gap-files-season-body');
    if (!button || !panel) return;
    const expanded = button.getAttribute('aria-expanded') !== 'true';
    button.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    button.setAttribute('aria-label', `${expanded ? '收起' : '展开'} S${String(seasonNumber).padStart(2, '0')}`);
    panel.hidden = !expanded;
    section.classList.toggle('is-collapsed', !expanded);
    if (expanded) gapState.fileCollapsedSeasons.delete(key);
    else gapState.fileCollapsedSeasons.add(key);
}

function gapFileMissingTargets() {
    const data = gapState.fileData || {};
    const grouped = new Map();
    const seasonOnly = new Set();
    (Array.isArray(data.episodes) ? data.episodes : []).forEach(item => {
        if (!item?.missing) return;
        const season = Number(item.season || 0);
        const episode = Number(item.episode || 0);
        if (isSeasonMissingGap(item)) {
            if (Number.isInteger(season) && season >= 0) seasonOnly.add(season);
            return;
        }
        if (!Number.isInteger(episode) || episode <= 0) return;
        if (!grouped.has(season)) grouped.set(season, new Set());
        grouped.get(season).add(episode);
    });
    const targets = Array.from(seasonOnly).sort((a, b) => a - b).map(season => ({
        season,
        episodes: [],
        season_missing: true,
    }));
    targets.push(...Array.from(grouped.entries()).sort((a, b) => a[0] - b[0]).map(([season, episodes]) => ({
        season,
        episodes: Array.from(episodes).sort((a, b) => a - b),
    })).filter(target => target.episodes.length));
    return targets;
}

function gapCd2BaseUrl() {
    const configured = String(gapState.clouddriveUrl || '').trim().replace(/\/+$/, '');
    if (configured) return configured;
    return window.location.hostname ? `${window.location.protocol}//${window.location.hostname}:19798` : '';
}

function normaliseCd2MediaPath(path) {
    let value = String(path || '').trim().replace(/\\/g, '/');
    if (!value) return '';
    value = value.replace(/\/+/g, '/');
    if (!value.startsWith('/')) value = `/${value}`;
    const lower = value.toLowerCase();
    const openIndex = lower.indexOf('/115open/');
    if (openIndex >= 0) {
        value = value.slice(openIndex);
    } else {
        const driveMarker = '/clouddrive/';
        const driveIndex = lower.indexOf(driveMarker);
        if (driveIndex < 0) return '';
        value = value.slice(driveIndex + driveMarker.length - 1);
    }
    if (!value.startsWith('/')) value = `/${value}`;
    return value.replace(/\/+$/, '');
}

function gapPathLeaf(path) {
    const parts = String(path || '').split('/').filter(Boolean);
    return parts.length ? parts[parts.length - 1] : '';
}

function gapParentPath(path) {
    const value = String(path || '').replace(/\/+$/, '');
    const index = value.lastIndexOf('/');
    return index > 0 ? value.slice(0, index) : value;
}

function gapLooksLikeFilePath(path) {
    return /\.[a-z0-9]{2,8}$/i.test(gapPathLeaf(path));
}

function stripGapSeasonFolder(path) {
    const leaf = gapPathLeaf(path);
    if (/^(?:season|s)\s*0?\d{1,2}$/i.test(leaf) || /^第\s*\d{1,2}\s*季$/.test(leaf)) {
        return gapParentPath(path);
    }
    return path;
}

function gapCd2DirectoryFromMediaPath(path, stripFile = true) {
    let value = normaliseCd2MediaPath(path);
    if (!value) return '';
    if (stripFile && gapLooksLikeFilePath(value)) value = gapParentPath(value);
    return stripGapSeasonFolder(value);
}

function gapCd2SeriesPath() {
    const data = gapState.fileData || {};
    const series = data.series || {};
    const seriesPath = gapCd2DirectoryFromMediaPath(series.path || series.file_path || '', false);
    if (seriesPath) return seriesPath;
    const episodes = Array.isArray(data.episodes) ? data.episodes : [];
    for (const item of episodes) {
        const sources = Array.isArray(item?.media_sources) ? item.media_sources : [];
        for (const source of sources) {
            const path = gapCd2DirectoryFromMediaPath(source?.path || '');
            if (path) return path;
        }
        const path = gapCd2DirectoryFromMediaPath(item?.path || '');
        if (path) return path;
    }
    return '';
}

function gapCd2FilesUrl() {
    const base = gapCd2BaseUrl();
    const path = gapCd2SeriesPath();
    if (!base || !path) return '';
    return `${base}/?page=files&path=${encodeURIComponent(path)}`;
}

function openGapCd2Files() {
    const base = gapCd2BaseUrl();
    const path = gapCd2SeriesPath();
    if (!base) {
        showToast('warning', 'CD2 地址未配置');
        return;
    }
    if (!path) {
        showToast('warning', '没有可定位的 CD2 路径');
        return;
    }
    window.open(`${base}/?page=files&path=${encodeURIComponent(path)}`, '_blank', 'noopener,noreferrer');
}

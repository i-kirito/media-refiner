name: Deploy NAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: media-refiner-nas
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on NAS runner
    if: ${{ vars.ENABLE_SELF_HOSTED_NAS_DEPLOY == 'true' }}
    runs-on: [self-hosted, media-refiner-nas]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Media Refiner
        env:
          MEDIA_REFINER_SRC_DIR: ${{ github.workspace }}
          MEDIA_REFINER_RUNTIME_DIR: /volume2/docker/media-refiner
          MEDIA_REFINER_CONFIG_DIR: /volume2/docker/media-refiner/config
          MEDIA_REFINER_DATA_DIR: /volume2/docker/media-refiner/data
          MEDIA_REFINER_REPO: https://github.com/i-kirito/media-refiner.git
          MEDIA_REFINER_BRANCH: main
          MEDIA_REFINER_FORCE: "1"
        run: |
          chmod +x scripts/deploy-from-github.sh
          scripts/deploy-from-github.sh
